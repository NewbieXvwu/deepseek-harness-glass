name: CUT5.12 legacy test classification

on:
  push:
    branches: [gpt-continue-todo-20260905]
    paths: [.github/workflows/cut512-test-audit.yml]

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt-continue-todo-20260905
      - name: Classify legacy-dependent test methods
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('glass/Tests/Core/NativeSessionStoreTests.swift')
          s = p.read_text()
          starts = list(re.finditer(r'^    func (test\w+)\([^\n]*\)\s*(?:async\s*)?(?:throws\s*)?\{', s, re.M))
          for i,m in enumerate(starts):
              a=m.start(); b=starts[i+1].start() if i+1<len(starts) else len(s)
              body=s[a:b]
              tags=[]
              for needle,label in [('applyMuxFrame','mux'), ('session/subscribed','subscribed'), ('.history(sessionID:','history-call')]:
                  if needle in body: tags.append(label)
              if tags:
                  print(f'{m.group(1)} [{",".join(tags)}] lines={s.count(chr(10),0,a)+1}-{s.count(chr(10),0,b)+1}')
          print('=== NativeSessionAPI conformers ===')
          for f in Path('glass/Tests').rglob('*.swift'):
              t=f.read_text()
              if 'NativeSessionAPI' in t or 'func history(sessionID:' in t:
                  print(f)
                  for line in t.splitlines():
                      if 'NativeSessionAPI' in line or 'func history(sessionID:' in line:
                          print('  '+line.strip())
          PY
      - name: Remove audit helper
        if: always()
        run: |
          rm .github/workflows/cut512-test-audit.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/cut512-test-audit.yml
          git commit -m 'ci: remove CUT5.12 test audit helper'
          git push origin HEAD:gpt-continue-todo-20260905
