name: CUT5.9 prompt intent one-shot

on:
  push:
    branches: [gpt-continue-todo-20260905]
    paths:
      - tools/cut59_prompt_intent.py
      - .github/workflows/cut59-prompt-intent.yml

permissions:
  contents: write

jobs:
  apply-cut:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: gpt-continue-todo-20260905
      - name: Apply exact Store edit
        run: python3 tools/cut59_prompt_intent.py
      - name: Commit result and remove helpers
        shell: bash
        run: |
          set -euo pipefail
          rm tools/cut59_prompt_intent.py .github/workflows/cut59-prompt-intent.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add glass/Sources/Core/Session/NativeSessionStore.swift tools/cut59_prompt_intent.py .github/workflows/cut59-prompt-intent.yml
          git diff --cached --check
          git diff --cached -- glass/Sources/Core/Session/NativeSessionStore.swift
          git commit -m "core: retain session prompt identity across retry"
          git push origin HEAD:gpt-continue-todo-20260905
