name: apply-optional-session-api
on:
  push:
    branches: [gpt-continue-todo-20260905]
    paths: [.github/workflows/apply-optional-session-api.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('glass/Sources/Core/Session/NativeSessionStore.swift')
          s=p.read_text()
          old='        using api: any NativeSessionAPI,\n'
          new='        using api: (any NativeSessionAPI)? = nil,\n'
          if s.count(old)!=1: raise SystemExit('open api signature mismatch')
          s=s.replace(old,new,1)
          old='                // are cut over to rc.1 Remote.\n                let models = try await api.models(sessionID: sessionID)\n'
          new='                // are cut over to rc.1 Remote.\n                guard let api else { throw DSHTransportError.invalidEndpoint }\n                let models = try await api.models(sessionID: sessionID)\n'
          if s.count(old)!=1: raise SystemExit('legacy fallback mismatch')
          p.write_text(s.replace(old,new,1))
          PY
          git rm .github/workflows/apply-optional-session-api.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add glass/Sources/Core/Session/NativeSessionStore.swift
          git commit -m "refactor: make legacy session api optional on open"
          git push origin HEAD:gpt-continue-todo-20260905
