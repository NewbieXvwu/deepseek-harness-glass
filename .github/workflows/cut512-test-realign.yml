name: CUT5.12 store test realignment

on:
  push:
    branches: [gpt-continue-todo-20260905]
    paths: [.github/workflows/cut512-test-realign.yml]

permissions:
  contents: write

jobs:
  realign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: gpt-continue-todo-20260905
          fetch-depth: 0

      - name: Retire legacy history fixtures and seed image limits through projection authority
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('glass/Tests/Core/NativeSessionStoreTests.swift')
          text = path.read_text()

          def brace_end(source, open_brace):
              depth = 0
              i = open_brace
              state = 'code'
              while i < len(source):
                  c = source[i]
                  n = source[i + 1] if i + 1 < len(source) else ''
                  if state == 'code':
                      if c == '"': state = 'string'
                      elif c == '/' and n == '/': state = 'line'; i += 1
                      elif c == '/' and n == '*': state = 'block'; i += 1
                      elif c == '{': depth += 1
                      elif c == '}':
                          depth -= 1
                          if depth == 0: return i + 1
                  elif state == 'string':
                      if c == '\\': i += 1
                      elif c == '"': state = 'code'
                  elif state == 'line':
                      if c == '\n': state = 'code'
                  elif state == 'block':
                      if c == '*' and n == '/': state = 'code'; i += 1
                  i += 1
              raise RuntimeError('unbalanced braces')

          def remove_test(source, name):
              match = re.search(r'^    func ' + re.escape(name) + r'\s*\(', source, re.M)
              if not match:
                  raise RuntimeError(f'missing test {name}')
              end = brace_end(source, source.find('{', match.start()))
              if end < len(source) and source[end] == '\n': end += 1
              return source[:match.start()] + source[end:]

          for name in [
              'testLoadOlderHistoryGuardsKeepWindowAndAdoptEmptyPageHasMore',
              'testNewEndpointOpenSupersedesStaleInitialHistoryAuthority',
              'testResidentResyncIgnoresLateFailureFromStaleInitialHistory',
              'testResidentResyncSupersedesStaleInitialHistoryOnSameEndpoint',
          ]:
              text = remove_test(text, name)

          image_projection = '''        store.projections.apply(
            sessionID: {session},
            key: "imageLimits",
            value: .object([
                "maxImageBytes": .number(4_096),
                "maxImagesPerMessage": .number(2),
                "maxMessageImageBytes": .number(8_192),
                "maxImagePixels": .number(16),
                "maxImageDimension": .number(4),
                "mediaTypes": .array([.string("image/png")]),
            ]),
            seq: 0
        )
'''

          accepted = '        store.open(sessionID: sessionID, using: api, endpoint: URL(string: "http://127.0.0.1:1")!)\n        await eventually(timeout: 1) { store.imageAttachmentLimits != nil }\n'
          accepted_replacement = '        store.open(sessionID: sessionID, using: api, endpoint: URL(string: "http://127.0.0.1:1")!)\n' + image_projection.format(session='sessionID') + '        await eventually(timeout: 1) { store.imageAttachmentLimits != nil }\n'
          assert text.count(accepted) == 1, text.count(accepted)
          text = text.replace(accepted, accepted_replacement)

          rejected = '        store.open(sessionID: "rejected-image-prompt-session", using: api, endpoint: URL(string: "http://127.0.0.1:1")!)\n        await eventually(timeout: 1) { store.imageAttachmentLimits != nil }\n'
          rejected_replacement = '        store.open(sessionID: "rejected-image-prompt-session", using: api, endpoint: URL(string: "http://127.0.0.1:1")!)\n' + image_projection.format(session='"rejected-image-prompt-session"') + '        await eventually(timeout: 1) { store.imageAttachmentLimits != nil }\n'
          assert text.count(rejected) == 1, text.count(rejected)
          text = text.replace(rejected, rejected_replacement)

          path.write_text(text)
          PY
          git diff --check

      - name: Commit test contract realignment
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add glass/Tests/Core/NativeSessionStoreTests.swift
          git commit -m "test: align store coverage with runtime authority"
          git push origin HEAD:gpt-continue-todo-20260905
