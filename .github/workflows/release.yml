name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      signing_identity:
        description: "Installed Developer ID Application identity; leave blank for Ad-hoc signing"
        required: false
        default: ""
        type: string

permissions:
  contents: write

env:
  DSH_NODE_VERSION: 24.19.0

jobs:
  build-macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Download bundled Node
        run: |
          curl -fsSL "https://nodejs.org/dist/v${DSH_NODE_VERSION}/node-v${DSH_NODE_VERSION}-darwin-arm64.tar.gz" -o /tmp/node.tgz
          tar -xzf /tmp/node.tgz -C /tmp
          mkdir -p glass/build/node
          cp "/tmp/node-v${DSH_NODE_VERSION}-darwin-arm64/bin/node" glass/build/node/node
          chmod +x glass/build/node/node
          test "$(glass/build/node/node --version)" = "v${DSH_NODE_VERSION}"

      - name: Install pinned backend payload
        run: |
          rm -rf glass/build/backend
          mkdir -p glass/build/backend
          cp glass/ci/dsh-backend-payload/package.json glass/build/backend/package.json
          cp glass/ci/dsh-backend-payload/package-lock.json glass/build/backend/package-lock.json
          npm ci --no-audit --no-fund --prefix glass/build/backend

      - name: Smoke-test authenticated backend
        run: |
          set -euo pipefail
          TMP_HOME=$(mktemp -d)
          COOKIE_JAR=$(mktemp)
          trap 'kill "${BACKEND_PID:-}" 2>/dev/null || true; rm -rf "$TMP_HOME" "$COOKIE_JAR"' EXIT
          DSH_HOME="$TMP_HOME" glass/build/node/node --expose-internals \
            glass/build/backend/node_modules/@deepseek-ai/dsh/lib/bin.js web --port 0 \
            > /tmp/dsh-smoke.log 2>&1 &
          BACKEND_PID=$!

          URL=""
          for _ in {1..15}; do
            if ! kill -0 "$BACKEND_PID" 2>/dev/null; then
              tail -20 /tmp/dsh-smoke.log
              exit 1
            fi
            URL=$(sed -n 's/.*dsh web: \(http:\/\/127\.0\.0\.1:[^[:space:]]*\).*/\1/p' /tmp/dsh-smoke.log | head -1)
            [ -n "$URL" ] && break
            sleep 1
          done
          [ -n "$URL" ] || { tail -20 /tmp/dsh-smoke.log; exit 1; }
          curl -fsS -L -c "$COOKIE_JAR" -b "$COOKIE_JAR" "$URL" > /dev/null

      - name: Assemble app
        run: |
          export APP_PATH="$PWD/glass/dist/DeepSeek Harness.app"
          export CODESIGN_IDENTITY="${{ inputs.signing_identity || '-' }}"
          cd glass && ./assemble.sh

      - name: Verify signature
        run: |
          codesign -v "glass/dist/DeepSeek Harness.app"
          test -z "$(find 'glass/dist/DeepSeek Harness.app' -type l)" \
            && echo "no symlinks (dmg-safe)" || { echo "symlinks present"; exit 1; }

      - name: Make DMG and ZIP
        run: |
          mkdir -p dmg-stage
          cp -R "glass/dist/DeepSeek Harness.app" dmg-stage/
          ln -s /Applications dmg-stage/Applications
          hdiutil create -volname "DeepSeek Harness Glass" -srcfolder dmg-stage \
            -ov -format UDZO "DeepSeek Harness Glass-${GITHUB_REF_NAME}.dmg"
          ditto -c -k --sequesterRsrc --keepParent "glass/dist/DeepSeek Harness.app" \
            "DeepSeek Harness Glass-${GITHUB_REF_NAME}.zip"
          rm -rf dmg-stage

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            DeepSeek Harness Glass-*.dmg
            DeepSeek Harness Glass-*.zip
          draft: false
          generate_release_notes: true
