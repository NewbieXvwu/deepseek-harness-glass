name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      signing_identity:
        description: "Installed Developer ID Application identity; leave blank for Ad-hoc signing"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned Host payload metadata
        run: |
          python3 tools/check-host-upgrade-report.py --self-test
          IFS=$'\t' read -r NODE_RUNTIME_VERSION DSH_VERSION WEB_FRONTEND_VERSION < <(python3 tools/emit-build-manifest.py --release-inputs)
          {
            echo "NODE_RUNTIME_VERSION=$NODE_RUNTIME_VERSION"
            echo "DSH_VERSION=$DSH_VERSION"
            echo "WEB_FRONTEND_VERSION=$WEB_FRONTEND_VERSION"
          } >> "$GITHUB_ENV"

      - name: Download bundled Node (pinned)
        run: |
          curl -fsSL "https://nodejs.org/dist/v${NODE_RUNTIME_VERSION}/node-v${NODE_RUNTIME_VERSION}-darwin-arm64.tar.gz" -o /tmp/node.tgz
          tar -xzf /tmp/node.tgz -C /tmp
          mkdir -p glass/build/node
          cp "/tmp/node-v${NODE_RUNTIME_VERSION}-darwin-arm64/bin/node" glass/build/node/node
          chmod +x glass/build/node/node

      - name: Install backend payload (pinned)
        run: |
          mkdir -p glass/build/backend
          cd glass/build/backend
          cat > package.json <<EOF
          {
            "name": "dsh-backend-payload",
            "private": true,
            "description": "Pinned dsh backend payload for DeepSeek Harness Glass",
            "dependencies": {
              "@deepseek-ai/dsh": "${DSH_VERSION}",
              "@deepseek-ai/dsh-web-frontend": "${WEB_FRONTEND_VERSION}"
            }
          }
          EOF
          npm install --no-audit --no-fund

      - name: Smoke-test backend
        run: |
          TMP_HOME=$(mktemp -d)
          DSH_HOME="$TMP_HOME" glass/build/node/node --expose-internals \
            glass/build/backend/node_modules/@deepseek-ai/dsh/lib/bin.js web --port 0 \
            > /tmp/dsh-smoke.log 2>&1 &
          BACKEND_PID=$!
          sleep 12
          if kill -0 "$BACKEND_PID" 2>/dev/null; then
            echo "backend OK: $(grep -o 'dsh web: http://[0-9.:]*' /tmp/dsh-smoke.log | head -1)"
            kill "$BACKEND_PID"
          else
            echo "backend failed:"; tail -20 /tmp/dsh-smoke.log; exit 1
          fi

      - name: Assemble app
        run: |
          export APP_PATH="$PWD/glass/dist/DeepSeek Harness.app"
          export CODESIGN_IDENTITY="${{ inputs.signing_identity || '-' }}"
          cd glass && ./assemble.sh

      - name: Verify signature
        run: |
          codesign -v "glass/dist/DeepSeek Harness.app"
          test -z "$(find 'glass/dist/DeepSeek Harness.app' -type l)" \
            && echo "no symlinks (dmg-safe)" || { echo "symlinks present"; exit 1; }

      - name: Make DMG and ZIP
        run: |
          mkdir -p dmg-stage
          cp -R "glass/dist/DeepSeek Harness.app" dmg-stage/
          ln -s /Applications dmg-stage/Applications
          hdiutil create -volname "DeepSeek Harness Glass" -srcfolder dmg-stage \
            -ov -format UDZO "DeepSeek Harness Glass-${GITHUB_REF_NAME}.dmg"
          ditto -c -k --sequesterRsrc --keepParent "glass/dist/DeepSeek Harness.app" \
            "DeepSeek Harness Glass-${GITHUB_REF_NAME}.zip"
          rm -rf dmg-stage

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            DeepSeek Harness Glass-*.dmg
            DeepSeek Harness Glass-*.zip
          draft: false
          generate_release_notes: true
