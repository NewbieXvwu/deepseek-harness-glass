name: documentation-integrity

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "README.zh.md"
      - "CONTRIBUTING.md"
      - "TODO.md"
      - "notes/**/*.md"
      - "visual-review/**/*.md"
      - ".github/workflows/documentation-integrity.yml"
      - "tools/check-markdown-links.py"
  pull_request:
    paths:
      - "README.md"
      - "README.zh.md"
      - "CONTRIBUTING.md"
      - "TODO.md"
      - "notes/**/*.md"
      - "visual-review/**/*.md"
      - ".github/workflows/documentation-integrity.yml"
      - "tools/check-markdown-links.py"
  workflow_dispatch:

permissions:
  contents: read

# Allow one concurrent run per PR, cancelling previous in-flight runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-documentation:
    name: verify documentation integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check internal links
        run: python3 tools/check-markdown-links.py
