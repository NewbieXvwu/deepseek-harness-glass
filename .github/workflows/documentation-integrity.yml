name: documentation-integrity

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "README.zh.md"
      - "CONTRIBUTING.md"
      - "TODO.md"
      - "CONTINUOUS_EXECUTION_PLAN.md"
      - "notes/**"
      - "visual-review/**"
      - "glass/Sources/Spec/HostUpgradeReport.json"
      - "glass/Sources/Spec/SupportedHostBuilds.json"
      - "glass/Sources/Spec/OfficialUISpec/official-ui-spec-build.json"
      - "glass/Sources/Spec/Locales/official-locales.json"
      - "glass/Sources/Core/Resources/official-raw-event-replay-fixtures.json"
      - ".github/workflows/documentation-integrity.yml"
      - "tools/check-markdown-links.py"
      - "tools/check-host-upgrade-report.py"
  pull_request:
    paths:
      - "README.md"
      - "README.zh.md"
      - "CONTRIBUTING.md"
      - "TODO.md"
      - "CONTINUOUS_EXECUTION_PLAN.md"
      - "notes/**"
      - "visual-review/**"
      - "glass/Sources/Spec/HostUpgradeReport.json"
      - "glass/Sources/Spec/SupportedHostBuilds.json"
      - "glass/Sources/Spec/OfficialUISpec/official-ui-spec-build.json"
      - "glass/Sources/Spec/Locales/official-locales.json"
      - "glass/Sources/Core/Resources/official-raw-event-replay-fixtures.json"
      - ".github/workflows/documentation-integrity.yml"
      - "tools/check-markdown-links.py"
      - "tools/check-host-upgrade-report.py"
  workflow_dispatch:

permissions:
  contents: read

# Allow one concurrent run per PR, cancelling previous in-flight runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-documentation:
    name: verify documentation integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check internal links
        run: python3 tools/check-markdown-links.py

      - name: Verify structured Host upgrade report
        run: python3 tools/check-host-upgrade-report.py --self-test

      - name: Verify visual review artifacts exist
        run: |
          set -euo pipefail
          if [[ ! -d "visual-review" ]]; then
            echo "::error::visual-review directory is missing"
            exit 1
          fi
          dirs=(visual-review/official-*)
          if [[ ${#dirs[@]} -eq 0 || ! -e "${dirs[0]}" ]]; then
            echo "::error::No visual-review/official-* directories found"
            exit 1
          fi
          failed=0
          for dir in "${dirs[@]}"; do
            if [[ -d "$dir" ]]; then
              artifact_count=$(find "$dir" -maxdepth 1 -type f \( -name "*.md" -o -name "*.png" -o -name "*.webp" -o -name "*.json" \) | wc -l | tr -d ' ')
              md_or_png=$(find "$dir" -maxdepth 1 -type f \( -name "*.md" -o -name "*.png" -o -name "*.webp" \) | wc -l | tr -d ' ')
              if [[ "$artifact_count" -eq 0 || "$md_or_png" -eq 0 ]]; then
                echo "::error::Visual review directory '$dir' is missing required report (.md) or image (.png/.webp) artifacts"
                failed=1
              else
                echo "Verified visual review directory: $dir ($artifact_count artifacts, $md_or_png reports/images)"
              fi
            fi
          done
          if [[ "$failed" -ne 0 ]]; then
            exit 1
          fi
