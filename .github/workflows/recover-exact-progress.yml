name: recover-exact-progress

on:
  push:
    branches:
      - gpt-continue-todo-20260905
    paths:
      - .github/workflows/recover-exact-progress.yml

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact recovered Git patch
        shell: bash
        run: |
          set -euo pipefail
          cat .recovery/chunk-* > /tmp/recovery.patch.gz.b64
          base64 --decode /tmp/recovery.patch.gz.b64 > /tmp/recovery.patch.gz
          gzip -dc /tmp/recovery.patch.gz > /tmp/recovery.patch
          git apply --index /tmp/recovery.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "restore: exact recovered progress a52a0c2"
          git push origin HEAD:gpt-continue-todo-20260905
