name: CUT5.12 legacy ingest clean cut

on:
  push:
    branches: [gpt-continue-todo-20260905]
    paths: [.github/workflows/cut512-clean-ingest.yml]

permissions:
  contents: write

jobs:
  clean-cut:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: gpt-continue-todo-20260905
          fetch-depth: 0

      - name: Replay validated production cut and align remaining Store contracts
        shell: bash
        run: |
          set -euo pipefail
          git show HEAD^:.github/workflows/cut512-clean-ingest.yml > /tmp/cut512-parent.yml
          python3 - <<'PY'
          from pathlib import Path

          lines = Path('/tmp/cut512-parent.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(lines) if "python3 - <<'PY'" in line) + 1
          end = next(i for i in range(start, len(lines)) if lines[i].strip() == 'PY')
          body = []
          for line in lines[start:end]:
              body.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/cut512-production.py').write_text('\n'.join(body) + '\n')
          PY
          python3 /tmp/cut512-production.py

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('glass/Tests/Core/NativeSessionStoreTests.swift')
          text = path.read_text()

          def brace_end(source, open_brace):
              depth = 0
              i = open_brace
              state = 'code'
              while i < len(source):
                  c = source[i]
                  n = source[i + 1] if i + 1 < len(source) else ''
                  if state == 'code':
                      if c == '"': state = 'string'
                      elif c == '/' and n == '/': state = 'line'; i += 1
                      elif c == '/' and n == '*': state = 'block'; i += 1
                      elif c == '{': depth += 1
                      elif c == '}':
                          depth -= 1
                          if depth == 0: return i + 1
                  elif state == 'string':
                      if c == '\\': i += 1
                      elif c == '"': state = 'code'
                  elif state == 'line':
                      if c == '\n': state = 'code'
                  elif state == 'block':
                      if c == '*' and n == '/': state = 'code'; i += 1
                  i += 1
              raise RuntimeError('unbalanced braces')

          def remove_test(source, name):
              match = re.search(r'^    func ' + re.escape(name) + r'\s*\(', source, re.M)
              if not match:
                  raise RuntimeError(f'missing expected retired test {name}')
              end = brace_end(source, source.find('{', match.start()))
              if end < len(source) and source[end] == '\n': end += 1
              return source[:match.start()] + source[end:]

          for name in [
              'testLoadOlderHistoryGuardsKeepWindowAndAdoptEmptyPageHasMore',
              'testNewEndpointOpenSupersedesStaleInitialHistoryAuthority',
              'testResidentResyncIgnoresLateFailureFromStaleInitialHistory',
              'testResidentResyncSupersedesStaleInitialHistoryOnSameEndpoint',
          ]:
              text = remove_test(text, name)

          projection = '''        store.projections.apply(
              sessionID: {session},
              key: "imageLimits",
              value: .object([
                  "maxImageBytes": .number(4_096),
                  "maxImagesPerMessage": .number(2),
                  "maxMessageImageBytes": .number(8_192),
                  "maxImagePixels": .number(16),
                  "maxImageDimension": .number(4),
                  "mediaTypes": .array([.string("image/png")]),
              ]),
              seq: 0
          )
          '''

          accepted = '        store.open(sessionID: sessionID, using: api, endpoint: URL(string: "http://127.0.0.1:1")!)\n        await eventually(timeout: 1) { store.imageAttachmentLimits != nil }\n'
          rejected = '        store.open(sessionID: "rejected-image-prompt-session", using: api, endpoint: URL(string: "http://127.0.0.1:1")!)\n        await eventually(timeout: 1) { store.imageAttachmentLimits != nil }\n'
          assert text.count(accepted) == 1, text.count(accepted)
          assert text.count(rejected) == 1, text.count(rejected)
          text = text.replace(
              accepted,
              accepted.split('        await eventually', 1)[0]
              + projection.format(session='sessionID')
              + '        await eventually(timeout: 1) { store.imageAttachmentLimits != nil }\n',
              1,
          )
          text = text.replace(
              rejected,
              rejected.split('        await eventually', 1)[0]
              + projection.format(session='"rejected-image-prompt-session"')
              + '        await eventually(timeout: 1) { store.imageAttachmentLimits != nil }\n',
              1,
          )
          path.write_text(text)
          PY
          git diff --check

      - name: Prove legacy ingest symbols are gone from production
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -n --include='*.swift' 'applyMuxFrame' glass/Sources
          ! grep -R -n --include='*.swift' -E '(subscribedLastSequence|requestAuthorityRecovery|recoveryLiveBuffer|recoveryBufferGeneration|SessionSubscribedDTO)' glass/Sources
          ! grep -R -n --include='*.swift' -E '\.history\(sessionID:' glass/Sources
          ! grep -R -n --include='*.swift' -E 'func history\(sessionID:' glass/Sources
          ! grep -R -n --include='*.swift' 'SessionHistoryPager' glass/Sources

      - name: Compile SwiftPM app
        shell: bash
        run: |
          cd glass
          swift build --configuration release --product DeepSeekHarnessGlassApp

      - name: Run all XCTest suites
        shell: bash
        run: |
          cd glass
          swift test

      - name: Commit clean cut and remove helper
        shell: bash
        run: |
          rm .github/workflows/cut512-clean-ingest.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add glass/Sources/Core/Session/NativeSessionStore.swift \
                  glass/Sources/Core/Remote/RemoteDTOModels.swift \
                  glass/Sources/UI/Conversation/NativeConversationViews.swift \
                  glass/Tests/Core/NativeSessionStoreTests.swift \
                  .github/workflows/cut512-clean-ingest.yml
          git commit -m 'core: delete legacy session ingest state machine'
          git push origin HEAD:gpt-continue-todo-20260905
