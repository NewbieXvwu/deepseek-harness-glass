name: Stabilize recovery watermark teardown tests

on:
  push:
    branches: [gpt-continue-todo-20260905]
    paths:
      - tools/stabilize-recovery-watermark-tests.patch
      - .github/workflows/stabilize-recovery-watermark-tests.yml

permissions:
  contents: write

jobs:
  apply-test-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: gpt-continue-todo-20260905
      - name: Apply exact recovery teardown test edit and remove helpers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("glass/Tests/Core/NativeSessionStoreTests.swift")
          text = path.read_text()
          names = [
              "testSubscriptionWatermarkRollbackRecoversFullAuthorityWindow",
              "testSubscriptionWatermarkRecoveryRebuildsProjectionBaselineFromHostAuthority",
          ]
          expectation_anchor = '        let recoveryReachedHistory = expectation(description: '
          fulfillment_anchor = '        await fulfillment(of: [recoveryReachedHistory], timeout: 1)'
          expectation_suffix = (
              '\n        recoveryReachedHistory.expectedFulfillmentCount = 2'
              '\n        recoveryReachedHistory.assertForOverFulfill = true'
          )
          ready_suffix = '\n        await eventually(timeout: 1) { store.modelDirectoryStatus == .ready }'

          for name in names:
              marker = f"    func {name}() async {{"
              start = text.find(marker)
              if start < 0:
                  raise SystemExit(f"missing test function: {name}")
              end = text.find("\n    func ", start + len(marker))
              if end < 0:
                  end = len(text)
              block = text[start:end]
              if block.count(expectation_anchor) != 1:
                  raise SystemExit(f"unexpected expectation anchor count in {name}: {block.count(expectation_anchor)}")
              line_start = block.index(expectation_anchor)
              line_end = block.index("\n", line_start)
              original_line = block[line_start:line_end]
              block = block[:line_start] + original_line + expectation_suffix + block[line_end:]
              if block.count(fulfillment_anchor) != 1:
                  raise SystemExit(f"unexpected fulfillment anchor count in {name}: {block.count(fulfillment_anchor)}")
              block = block.replace(fulfillment_anchor, fulfillment_anchor + ready_suffix, 1)
              text = text[:start] + block + text[end:]

          path.write_text(text)
          PY
          rm tools/stabilize-recovery-watermark-tests.patch .github/workflows/stabilize-recovery-watermark-tests.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add glass/Tests/Core/NativeSessionStoreTests.swift tools/stabilize-recovery-watermark-tests.patch .github/workflows/stabilize-recovery-watermark-tests.yml
          git diff --cached --check
          git diff --cached -- glass/Tests/Core/NativeSessionStoreTests.swift
          git commit -m "test: drain watermark recovery before teardown"
          git push origin HEAD:gpt-continue-todo-20260905
