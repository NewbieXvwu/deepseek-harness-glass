name: CUT5.11 production address routing

on:
  push:
    branches: [gpt-continue-todo-20260905]
    paths: [.github/workflows/cut511-address-routing.yml]

permissions:
  contents: write

jobs:
  apply-cut:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt-continue-todo-20260905
          fetch-depth: 0
      - name: Route production runtime by selected address
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          shell = Path('glass/Sources/UI/Shell/NativeSplitContainer.swift')
          text = shell.read_text()
          old_selected = '''                    address: .session(sessionID: selectedSessionID),\n                    controlRuntime: sessionControlRuntime,'''
          new_selected = '''                    address: NativeSessionRuntimeAddressResolver.resolve(\n                        sessionID: selectedSessionID,\n                        subagentRoute: sessionStore.subagentRoute\n                    ),\n                    controlRuntime: sessionControlRuntime,'''
          old_select = '''                    address: .session(sessionID: sessionID),\n                    controlRuntime: sessionControlRuntime,'''
          new_select = '''                    address: NativeSessionRuntimeAddressResolver.resolve(\n                        sessionID: sessionID,\n                        subagentRoute: sessionStore.subagentRoute\n                    ),\n                    controlRuntime: sessionControlRuntime,'''
          assert text.count(old_selected) == 1, text.count(old_selected)
          assert text.count(old_select) == 1, text.count(old_select)
          text = text.replace(old_selected, new_selected).replace(old_select, new_select)
          shell.write_text(text)

          resolver = Path('glass/Sources/UI/Shell/NativeSessionRuntimeAddressResolver.swift')
          resolver.write_text('''#if DEEPSEEK_HARNESS_PACKAGE\n@testable import GlassCore\n#endif\n\n/// Maps the exact catalog-selected child route into the rc.1 session address.\n/// A stale route can never retarget an unrelated ordinary session.\nenum NativeSessionRuntimeAddressResolver {\n    static func resolve(\n        sessionID: String,\n        subagentRoute: NativeSessionStore.SubagentRoute?\n    ) -> SessionAddress {\n        guard let route = subagentRoute, route.childSessionID == sessionID else {\n            return .session(sessionID: sessionID)\n        }\n        let mode: SessionAddress.ChildMode\n        switch route.mode {\n        case .oneShot: mode = .oneShot\n        case .continuable: mode = .continuable\n        }\n        return .subagent(\n            parentSessionID: route.parentSessionID,\n            childSessionID: route.childSessionID,\n            mode: mode\n        )\n    }\n}\n''')

          test = Path('glass/Tests/App/NativeSessionRuntimeAddressResolverTests.swift')
          test.write_text('''import XCTest\n\n@testable import GlassCore\n@testable import GlassUI\n\n@MainActor\nfinal class NativeSessionRuntimeAddressResolverTests: XCTestCase {\n    func testOrdinarySessionHasOrdinaryAddress() {\n        XCTAssertEqual(\n            NativeSessionRuntimeAddressResolver.resolve(sessionID: "root", subagentRoute: nil),\n            .session(sessionID: "root")\n        )\n    }\n\n    func testContinuableCatalogChildKeepsParentAndMode() {\n        let route = NativeSessionStore.SubagentRoute(\n            parentSessionID: "parent",\n            childSessionID: "child",\n            mode: .continuable,\n            parentAvailable: true\n        )\n        XCTAssertEqual(\n            NativeSessionRuntimeAddressResolver.resolve(sessionID: "child", subagentRoute: route),\n            .subagent(parentSessionID: "parent", childSessionID: "child", mode: .continuable)\n        )\n    }\n\n    func testOneShotCatalogChildStaysReadOnlyAddress() {\n        let route = NativeSessionStore.SubagentRoute(\n            parentSessionID: "parent",\n            childSessionID: "child",\n            mode: .oneShot,\n            parentAvailable: false\n        )\n        XCTAssertEqual(\n            NativeSessionRuntimeAddressResolver.resolve(sessionID: "child", subagentRoute: route),\n            .subagent(parentSessionID: "parent", childSessionID: "child", mode: .oneShot)\n        )\n    }\n\n    func testStaleChildRouteCannotRetargetAnotherSession() {\n        let stale = NativeSessionStore.SubagentRoute(\n            parentSessionID: "parent",\n            childSessionID: "old-child",\n            mode: .continuable,\n            parentAvailable: true\n        )\n        XCTAssertEqual(\n            NativeSessionRuntimeAddressResolver.resolve(sessionID: "new-session", subagentRoute: stale),\n            .session(sessionID: "new-session")\n        )\n    }\n}\n''')
          PY
      - name: Commit result and remove helper
        shell: bash
        run: |
          rm .github/workflows/cut511-address-routing.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add glass/Sources/UI/Shell/NativeSplitContainer.swift glass/Sources/UI/Shell/NativeSessionRuntimeAddressResolver.swift glass/Tests/App/NativeSessionRuntimeAddressResolverTests.swift .github/workflows/cut511-address-routing.yml
          git commit -m 'core: preserve direct-subagent address in production runtime'
          git push origin HEAD:gpt-continue-todo-20260905
