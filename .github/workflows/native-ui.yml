name: native-ui

on:
  push:
    branches: [main]
    paths:
      - "glass/Sources/**"
      - "glass/Tests/**"
      - "glass/assemble.sh"
      - "glass/Info.plist"
      - "glass/Package.swift"
      - "glass/assets/**"
      - "glass/scripts/**"
      - "glass/ci/**"
      - "glass/Sources/Spec/SupportedHostBuilds.json"
      - "tools/reference-capture/**"
      - "tools/spec-generation/**"
      - "visual-review/**"
      - ".github/workflows/native-ui.yml"
      - "README.md"
      - "README.zh.md"
      - "CONTRIBUTING.md"
      - "TODO.md"
  pull_request:
    paths:
      - "glass/Sources/**"
      - "glass/Tests/**"
      - "glass/assemble.sh"
      - "glass/Info.plist"
      - "glass/Package.swift"
      - "glass/assets/**"
      - "glass/scripts/**"
      - "glass/ci/**"
      - "glass/Sources/Spec/SupportedHostBuilds.json"
      - "tools/reference-capture/**"
      - "tools/spec-generation/**"
      - "visual-review/**"
      - ".github/workflows/native-ui.yml"
      - "README.md"
      - "README.zh.md"
      - "CONTRIBUTING.md"
      - "TODO.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-capture-environment:
    name: diagnose runner capture environment
    runs-on: macos-26
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: A. Runner and OS identity
        continue-on-error: true
        run: |
          sw_vers
          uname -m
          xcrun --sdk macosx --show-sdk-version
          echo "whoami=$(whoami) uid=$(id -u)"

      - name: B. SIP status
        continue-on-error: true
        run: csrutil status

      - name: C. GUI session / bootstrap namespace
        continue-on-error: true
        run: |
          echo "--- launchctl managername ---"
          launchctl managername || echo "managername FAILED"
          echo "--- loginwindow ---"
          pgrep -x loginwindow && echo "loginwindow PRESENT" || echo "loginwindow ABSENT"
          echo "--- WindowServer ---"
          pgrep -x WindowServer && echo "WindowServer PRESENT" || echo "WindowServer ABSENT"
          echo "--- Dock (Aqua session indicator) ---"
          pgrep -x Dock && echo "Dock PRESENT" || echo "Dock ABSENT"
          echo "--- security session ---"
          launchctl print gui/$(id -u) 2>/dev/null | head -20 || echo "no gui domain for uid"

      - name: D. Displays
        continue-on-error: true
        run: system_profiler SPDisplaysDataType | head -60

      - name: E. Existing TCC screen-capture grants
        continue-on-error: true
        run: |
          for db in "/Library/Application Support/com.apple.TCC/TCC.db" \
                    "$HOME/Library/Application Support/com.apple.TCC/TCC.db"; do
            echo "=== $db ==="
            echo "--- schema ---"
            sudo sqlite3 "$db" "PRAGMA table_info(access);" 2>&1 | head -30 || true
            echo "--- kTCCServiceScreenCapture rows ---"
            sudo sqlite3 "$db" \
              "SELECT service,client,client_type,auth_value FROM access WHERE service='kTCCServiceScreenCapture';" 2>&1 || true
          done

      - name: F. Baseline screencapture (no app involved)
        continue-on-error: true
        run: |
          mkdir -p artifacts/diagnose
          echo "--- plain full-screen capture ---"
          /usr/sbin/screencapture -x artifacts/diagnose/plain-fullscreen.png \
            && echo "rc=0" || echo "FAILED rc=$?"
          echo "--- capture inside loginwindow bootstrap ---"
          LW=$(pgrep -x loginwindow || true)
          if [ -n "$LW" ]; then
            sudo launchctl bsexec "$LW" /usr/sbin/screencapture -x artifacts/diagnose/bsexec-fullscreen.png \
              && echo "rc=0" || echo "FAILED rc=$?"
          else
            echo "SKIPPED: no loginwindow pid"
          fi
          ls -la artifacts/diagnose/ || true

      - name: G. Classify baseline captures (black vs real content)
        continue-on-error: true
        run: |
          python3 -m venv /tmp/diag-venv
          source /tmp/diag-venv/bin/activate
          python -m pip install --disable-pip-version-check --no-input --quiet Pillow numpy
          python - <<'PY'
          import os
          from PIL import Image
          import numpy as np
          for name in ("plain-fullscreen.png", "bsexec-fullscreen.png"):
              p = os.path.join("artifacts/diagnose", name)
              if not os.path.exists(p):
                  print(f"{name}: MISSING")
                  continue
              a = np.asarray(Image.open(p).convert("RGB"), dtype=np.int16)
              nonblack = float((a.max(axis=2) > 8).mean())
              print(f"{name}: size={a.shape[1]}x{a.shape[0]} "
                    f"mean={a.mean():.2f} max={a.max()} "
                    f"nonblack_ratio={nonblack:.6f} "
                    f"=> {'REAL CONTENT' if nonblack > 0.01 else 'ALL BLACK'}")
          PY

      - name: H. Preflight screen-capture authorization for a test binary
        continue-on-error: true
        run: |
          cat > /tmp/preflight.swift <<'SWIFT'
          import CoreGraphics
          import Foundation
          let pre = CGPreflightScreenCaptureAccess()
          FileHandle.standardError.write(Data("CGPreflightScreenCaptureAccess=\(pre)\n".utf8))
          let req = CGRequestScreenCaptureAccess()
          FileHandle.standardError.write(Data("CGRequestScreenCaptureAccess=\(req)\n".utf8))
          SWIFT
          swiftc -O /tmp/preflight.swift -o /tmp/preflight 2>&1 | tail -5 || true
          /tmp/preflight || echo "preflight binary FAILED rc=$?"

      - name: I. Upload diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capture-diagnosis
          path: artifacts/diagnose/
          if-no-files-found: warn

  build-and-snapshot:
    name: build and snapshot native shell
    # macos-26 is GitHub's arm64 hosted image with the macOS 26 SDK and Xcode 26.
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Record macOS and Xcode toolchain
        run: |
          sw_vers
          uname -m
          xcodebuild -version | tee xcodebuild-version.txt
          xcrun --sdk macosx --show-sdk-version | tee macos-sdk-version.txt
          test "$(xcodebuild -version | awk '/Xcode/{print $2}' | cut -d. -f1)" = "26"

      - name: Checkout locked official DeepSeek Harness source
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: 99f6f02fecdb7dff40c3fbc9470f5907c29f74ca
          path: .reference/deepseek-harness

      - name: Download bundled Node runtime
        run: |
          curl -fsSL https://nodejs.org/dist/v24.19.0/node-v24.19.0-darwin-arm64.tar.gz -o /tmp/node.tgz
          tar -xzf /tmp/node.tgz -C /tmp
          mkdir -p glass/build/node
          cp /tmp/node-v24.19.0-darwin-arm64/bin/node glass/build/node/node
          chmod +x glass/build/node/node
          echo "NODE24_BIN=/tmp/node-v24.19.0-darwin-arm64/bin" >> "$GITHUB_ENV"

      - name: Build and capture locked official WebUI baseline
        run: |
          export PATH="$NODE24_BIN:$PATH"
          cd .reference/deepseek-harness
          corepack pnpm install --frozen-lockfile
          # The official Vite app consumes generated workspace package exports; build
          # those locked-source Host/Client libraries before building apps/web.
          NODE_OPTIONS="--max-old-space-size=8192" corepack pnpm run build:lib
          corepack pnpm --filter @deepseek-ai/dsh-web-frontend run build
          cp "$GITHUB_WORKSPACE/tools/reference-capture/capture-official-welcome.e2e.ts" apps/web/tests/
          corepack pnpm --filter @deepseek-ai/dsh-web-frontend exec playwright install chromium
          DSH_REFERENCE_SCREENSHOT_DIR="$GITHUB_WORKSPACE/artifacts/official-webui" \
            corepack pnpm exec vitest run --config vitest.web.config.ts apps/web/tests/capture-official-welcome.e2e.ts
          test -s "$GITHUB_WORKSPACE/artifacts/official-webui/welcome-no-workspace-light.png"
          test -s "$GITHUB_WORKSPACE/artifacts/official-webui/welcome-no-workspace-light.json"

      - name: Restore pinned DeepSeek Harness Host payload cache
        id: dsh-host-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.npm
            glass/build/backend/node_modules
          key: dsh-host-payload-v1-macos-26-arm64-node-24.19.0-${{ hashFiles('glass/ci/dsh-backend-payload/package-lock.json') }}

      - name: Install pinned DeepSeek Harness Host payload
        run: |
          mkdir -p glass/build/backend
          cp glass/ci/dsh-backend-payload/package.json glass/build/backend/package.json
          cp glass/ci/dsh-backend-payload/package-lock.json glass/build/backend/package-lock.json
          if [[ "${{ steps.dsh-host-cache.outputs.cache-hit }}" == "true" ]]; then
            test -d glass/build/backend/node_modules/@deepseek-ai/dsh
            test -d glass/build/backend/node_modules/@deepseek-ai/dsh-web-frontend
            echo "Reused cached pinned DeepSeek Harness Host payload."
          else
            cd glass/build/backend
            npm ci --no-audit --no-fund
          fi

      - name: Save pinned DeepSeek Harness Host payload cache
        if: steps.dsh-host-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.npm
            glass/build/backend/node_modules
          key: dsh-host-payload-v1-macos-26-arm64-node-24.19.0-${{ hashFiles('glass/ci/dsh-backend-payload/package-lock.json') }}

      - name: Verify fixed Host support boundary
        run: |
          python3 glass/ci/check-supported-host-build.py \
            --payload-dir glass/build/backend \
            --node glass/build/node/node

      - name: Validate generated Official UI spec build
        run: |
          python3 glass/ci/check-official-ui-spec-build.py \
            --official-root .reference/deepseek-harness
          python3 glass/ci/test-official-ui-spec-build.py \
            --official-root .reference/deepseek-harness

      - name: Validate generated official locales and UI copy lint
        run: |
          python3 glass/ci/check-official-locales.py \
            --official-root .reference/deepseek-harness
          python3 glass/ci/check-official-locale-literals.py
          python3 glass/ci/test-official-locale-literals.py

      - name: Validate generated official theme tokens
        run: |
          python3 glass/ci/check-official-theme-tokens.py \
            --official-root .reference/deepseek-harness

      - name: Validate official three-column layout fixtures
        run: |
          python3 glass/ci/check-official-column-layout-fixtures.py \
            --official-root .reference/deepseek-harness \
            --node "$NODE24_BIN/node"

      - name: Validate official interaction scene directory
        run: |
          python3 glass/ci/check-official-interaction-scenes.py \
            --official-root .reference/deepseek-harness

      - name: Enforce native-only core UI
        run: ./glass/ci/check-no-webview.sh

      - name: Validate runtime asset migration inventory
        run: python3 glass/ci/check-runtime-asset-inventory.py

      - name: Validate module boundaries
        run: python3 glass/ci/check-module-boundaries.py

      - name: Enforce feature facade boundary
        run: python3 glass/ci/check-no-feature-transport.py

      - name: Enforce system structural material policy
        run: python3 glass/ci/check-native-structural-material.py

      - name: Enforce explicit Liquid Glass policy
        run: python3 glass/ci/check-glass-policy.py

      - name: Validate native accessibility baseline
        run: python3 glass/ci/check-accessibility-baseline.py

      - name: Validate official RPC DTO source manifest
        run: |
          python3 glass/ci/check-official-rpc-dto-manifest.py \
            --official-root .reference/deepseek-harness

      - name: Validate official transport contract baseline
        run: |
          python3 glass/ci/check-official-transport-contract.py \
            --official-root .reference/deepseek-harness

      - name: Independently compile declared SwiftPM targets
        run: |
          cd glass
          swift build --configuration release

      - name: Run generated Official UI spec tests
        run: |
          cd glass
          swift test --filter OfficialUISpecBuildTests

      - name: Run core Host lifecycle command-line tests
        env:
          DSH_GLASS_HOST_NODE: ${{ github.workspace }}/glass/build/node/node
          DSH_GLASS_HOST_ENTRY: ${{ github.workspace }}/glass/build/backend/node_modules/@deepseek-ai/dsh/lib/bin.js
        run: |
          cd glass
          swift test --filter HarnessHostControllerTests

      - name: Run verified Host + transport smoke gate
        env:
          DSH_GLASS_HOST_NODE: ${{ github.workspace }}/glass/build/node/node
          DSH_GLASS_HOST_ENTRY: ${{ github.workspace }}/glass/build/backend/node_modules/@deepseek-ai/dsh/lib/bin.js
        run: |
          cd glass
          swift test --filter HarnessHostTransportSmokeTests

      - name: Run native window lifecycle tests
        run: |
          cd glass
          swift test --filter GlassAppTests

      - name: Run native snapshot compositor fallback tests
        run: |
          cd glass
          swift test --filter SnapshotExporterTests

      - name: Run official RPC DTO fixture tests
        run: |
          cd glass
          swift test --filter RPCDTOFixtureTests

      - name: Run concurrent core transport tests
        run: |
          cd glass
          swift test --filter DSHClientTransportTests

      - name: Run reconnecting SSE transport tests
        run: |
          cd glass
          swift test --filter SSEClientTests

      - name: Run transport contract regression fixtures
        run: |
          cd glass
          swift test --filter TransportContractRegressionTests

      - name: Run native session log export tests
        run: |
          cd glass
          swift test --filter SessionLogExporterTests

      - name: Run session projection store tests
        run: |
          cd glass
          swift test --filter SessionProjectionStoreTests

      - name: Run native session state tests
        run: |
          cd glass
          swift test --filter NativeSessionStoreTests

      - name: Run session history pager tests
        run: |
          cd glass
          swift test --filter SessionHistoryPagerTests

      - name: Validate official UI specification provenance
        run: ./glass/ci/check-official-spec.py

      - name: Assemble native macOS app
        run: |
          export APP_PATH="$PWD/glass/dist/DeepSeek Harness.app"
          cd glass
          ./assemble.sh
          codesign -v "$APP_PATH"
          test -x "$APP_PATH/Contents/MacOS/DeepSeek Harness"

      - name: Generate native UI layout snapshots
        run: |
          snapshot_dir="$PWD/artifacts/native-shell"
          DSH_GLASS_SNAPSHOT_DIR="$snapshot_dir" \
            ./glass/scripts/verify-native-shell.sh "$PWD/glass/dist/DeepSeek Harness.app" \
            | tee native-shell-snapshot.log
          test -s "$snapshot_dir/welcome-light.png"
          test -s "$snapshot_dir/conversation-dark.png"
          test -s "$snapshot_dir/tooling-inspector-dark.png"
          test -s "$snapshot_dir/approval-panel-light.png"
          test -s "$snapshot_dir/question-composer-light.png"
          test -s "$snapshot_dir/workspace-search-official-viewport.png"
          test -s "$snapshot_dir/workspace-rename-official-viewport.png"
          test -s "$snapshot_dir/session-rename-official-viewport.png"
          test -s "$snapshot_dir/workspace-delete-official-viewport.png"
          test -s "$snapshot_dir/approval-panel-official-viewport.png"
          test -s "$snapshot_dir/question-composer-official-viewport.png"
          find "$snapshot_dir" -maxdepth 1 -type f -name '*.png' -print

      - name: Compare official and native welcome screenshots
        run: |
          python3 -m venv /tmp/dsh-visual-venv
          source /tmp/dsh-visual-venv/bin/activate
          python -m pip install --disable-pip-version-check --no-input Pillow numpy
          python glass/ci/test_visual_policy.py
          python glass/ci/compare_visual_pair.py \
            --official artifacts/official-webui/welcome-no-workspace-light.png \
            --native artifacts/native-shell/welcome-light.png \
            --out-dir artifacts/visual-diff \
            --scene welcome-no-workspace-light \
            --policy glass/Sources/Spec/Fixtures/visual-validation-policy.json
          test -s artifacts/visual-diff/welcome-no-workspace-light-comparison.png
          test -s artifacts/visual-diff/welcome-no-workspace-light-report.json

      - name: Upload native UI review bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-ui-${{ github.sha }}
          path: |
            artifacts/native-shell/
            artifacts/official-webui/
            artifacts/visual-diff/
            native-shell-snapshot.log
            xcodebuild-version.txt
            macos-sdk-version.txt
            glass/dist/DeepSeek Harness.app/Contents/Resources/SupportedHostBuilds.json
            glass/dist/DeepSeek Harness.app/Contents/Resources/BuildManifest.json
            glass/ci/dsh-backend-payload/package-lock.json
            glass/Sources/Spec/RuntimeAssetInventory.json
            glass/Sources/Spec/OfficialUISpec/official-ui-spec-build.json
            glass/Sources/Spec/OfficialUISpecBuild.swift
            glass/Sources/Spec/Locales/official-locales.json
            glass/Sources/Spec/OfficialLocaleCatalog.swift
            glass/Sources/Spec/Tokens/official-theme-tokens.json
            glass/Sources/Spec/OfficialThemeCatalog.swift
            glass/Sources/Spec/Fixtures/official-column-layout-fixtures.json
            glass/Sources/Spec/Fixtures/official-interaction-scenes.json
            glass/Sources/Spec/Fixtures/official-rpc-dto-manifest.json
            glass/Sources/Core/Resources/official-host-rpc-fixtures.json
            glass/Sources/Spec/Fixtures/official-transport-contract-manifest.json
            glass/Sources/Core/Resources/official-transport-contract-fixtures.json
            glass/Package.swift
          if-no-files-found: error
          retention-days: 14
