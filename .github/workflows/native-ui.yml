name: native-ui

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "README.zh.md"
      - "CONTRIBUTING.md"
      - "TODO.md"
      - "CONTINUOUS_EXECUTION_PLAN.md"
      - "notes/**"
      - "visual-review/**"
      - ".github/workflows/documentation-integrity.yml"
      - "tools/check-markdown-links.py"
  pull_request:
    paths-ignore:
      - "README.md"
      - "README.zh.md"
      - "CONTRIBUTING.md"
      - "TODO.md"
      - "CONTINUOUS_EXECUTION_PLAN.md"
      - "notes/**"
      - "visual-review/**"
      - ".github/workflows/documentation-integrity.yml"
      - "tools/check-markdown-links.py"
  workflow_dispatch:

permissions:
  contents: read

env:
  OFFICIAL_COMMIT: a66e4702047846cdaa10c66c9d3df3951f5ea70d
  DSH_NODE_VERSION: 24.19.0

# Allow one concurrent run per PR, cancelling previous in-flight runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-snapshot:
    name: build and snapshot native shell
    # macos-26 is GitHub's arm64 hosted image with the macOS 26 SDK and Xcode 26.
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Record macOS and Xcode toolchain
        run: |
          sw_vers
          uname -m
          xcodebuild -version | tee xcodebuild-version.txt
          xcrun --sdk macosx --show-sdk-version | tee macos-sdk-version.txt
          test "$(xcodebuild -version | awk '/Xcode/{print $2}' | cut -d. -f1)" = "26"
          # Runner image version goes into cache keys: an image roll can change
          # font rasterization, which must invalidate rendered baselines.
          echo "IMAGE_VERSION=${ImageVersion:-unknown}" >> "$GITHUB_ENV"

      - name: Checkout locked official DeepSeek Harness source
        uses: actions/checkout@v5
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ env.OFFICIAL_COMMIT }}
          path: .reference/deepseek-harness

      - name: Restore bundled Node runtime
        id: node-runtime-cache
        uses: actions/cache@v5
        with:
          path: |
            glass/build/node
            glass/build/node-runtime
          # v2 caches the full distribution, including the matching corepack
          # and npm launchers. A node-only cache silently fell back to the
          # runner's unrelated corepack on cold official WebUI builds.
          key: node-runtime-v2-${{ env.DSH_NODE_VERSION }}-darwin-arm64

      - name: Download bundled Node runtime
        if: steps.node-runtime-cache.outputs.cache-hit != 'true'
        run: |
          NODE_DIST="https://nodejs.org/dist"
          NODE_TARBALL="node-v${DSH_NODE_VERSION}-darwin-arm64.tar.gz"
          curl -fsSL "${NODE_DIST}/v${DSH_NODE_VERSION}/${NODE_TARBALL}" -o /tmp/node.tgz
          tar -xzf /tmp/node.tgz -C /tmp
          mkdir -p glass/build
          rm -rf glass/build/node-runtime
          mv "/tmp/node-v${DSH_NODE_VERSION}-darwin-arm64" glass/build/node-runtime
          mkdir -p glass/build/node
          cp glass/build/node-runtime/bin/node glass/build/node/node

      - name: Activate bundled Node runtime
        run: |
          chmod +x glass/build/node/node glass/build/node-runtime/bin/node
          test "$(glass/build/node/node --version)" = "v${DSH_NODE_VERSION}"
          test "$(glass/build/node-runtime/bin/node --version)" = "v${DSH_NODE_VERSION}"
          test -x glass/build/node-runtime/bin/corepack
          test -x glass/build/node-runtime/bin/npm
          # Upstream root scripts invoke `pnpm` again through nested npm run
          # calls. Enable the corepack shims alongside this exact Node runtime
          # so nested invocations cannot fall back to a runner-global tool.
          glass/build/node-runtime/bin/corepack enable --install-directory "$GITHUB_WORKSPACE/glass/build/node-runtime/bin"
          test -x glass/build/node-runtime/bin/pnpm
          echo "NODE24_BIN=$GITHUB_WORKSPACE/glass/build/node-runtime/bin" >> "$GITHUB_ENV"

      # Baselines are prepared by prepare-official-baseline.yml when their
      # inputs change. Normal native validation consumes the exact cache and
      # never rebuilds pnpm/Playwright on its critical path.
      - name: Restore prepared official WebUI baseline
        id: official-baseline-cache
        uses: actions/cache/restore@v5
        with:
          path: artifacts/official-webui
          key: official-webui-baseline-${{ env.OFFICIAL_COMMIT }}-${{ runner.os }}-${{ env.IMAGE_VERSION }}-${{ hashFiles('tools/reference-capture/capture-official-welcome.e2e.ts') }}

      # A cache miss is expected only when baseline inputs change. The dedicated
      # prepare workflow pre-warms main; this fallback keeps PR validation sound.
      - name: Build and capture official WebUI baseline on cache miss
        if: steps.official-baseline-cache.outputs.cache-hit != 'true'
        run: |
          export PATH="$NODE24_BIN:$PATH"
          cd .reference/deepseek-harness
          NODE_OPTIONS="--max-old-space-size=8192" corepack pnpm run build
          test -s apps/web/dist/index.html
          cp "$GITHUB_WORKSPACE/tools/reference-capture/capture-official-welcome.e2e.ts" apps/web/tests/
          corepack pnpm --filter @deepseek-ai/dsh-web-frontend exec playwright install chromium
          DSH_REFERENCE_SCREENSHOT_DIR="$GITHUB_WORKSPACE/artifacts/official-webui" \
            corepack pnpm exec vitest run --config vitest.web.config.ts apps/web/tests/capture-official-welcome.e2e.ts

      - name: Save fallback official WebUI baseline
        if: steps.official-baseline-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: artifacts/official-webui
          key: ${{ steps.official-baseline-cache.outputs.cache-primary-key }}

      # Dependency caches only support the specification gates below.
      - name: Restore official build dependency caches
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/pnpm/store
            ~/Library/Caches/ms-playwright
          key: official-webui-deps-${{ env.OFFICIAL_COMMIT }}-${{ hashFiles('.reference/deepseek-harness/pnpm-lock.yaml', '.reference/deepseek-harness/apps/web/package.json') }}

      # Specification gates run after the baseline cache branch, and several
      # gates invoke the locked TypeScript runtime (`tsx`). The baseline cache
      # contains rendered PNGs only, never node_modules, so install the exact
      # official workspace toolchain on every run before either branch proceeds.
      - name: Install locked official source toolchain
        run: |
          export PATH="$NODE24_BIN:$PATH"
          cd .reference/deepseek-harness
          corepack pnpm install --frozen-lockfile
          test -f node_modules/tsx/dist/cli.mjs

      - name: Verify official baseline artifacts
        run: |
          test -s "artifacts/official-webui/welcome-no-workspace-light.png"
          test -s "artifacts/official-webui/welcome-no-workspace-light.json"
          test -s "artifacts/official-webui/welcome-no-workspace-dark.png"
          test -s "artifacts/official-webui/welcome-no-workspace-dark.json"
          test -s "artifacts/official-webui/jobs-expanded-light.png"
          test -s "artifacts/official-webui/jobs-expanded-light.json"
          test -s "artifacts/official-webui/deliverables-light.png"
          test -s "artifacts/official-webui/deliverables-light.json"
          test -s "artifacts/official-webui/model-selector-light.png"
          test -s "artifacts/official-webui/model-selector-light.json"
          test -s "artifacts/official-webui/permission-confirmation-light.png"
          test -s "artifacts/official-webui/permission-confirmation-light.json"
          test -s "artifacts/official-webui/jobs-expanded-dark.png"
          test -s "artifacts/official-webui/jobs-expanded-dark.json"
          test -s "artifacts/official-webui/tooling-inspector-light.png"
          test -s "artifacts/official-webui/tooling-inspector-light.json"
          test -s "artifacts/official-webui/sidebar-rail-narrow-light.png"
          test -s "artifacts/official-webui/sidebar-rail-narrow-light.json"
          test -s "artifacts/official-webui/sidebar-rail-narrow-dark.png"
          test -s "artifacts/official-webui/sidebar-rail-narrow-dark.json"
          for scene in workspace-search-light workspace-search-dark workspace-rename-light workspace-rename-dark session-rename-light session-rename-dark workspace-delete-light workspace-delete-dark approval-composer-light question-composer-light; do
            test -s "artifacts/official-webui/${scene}.png"
            test -s "artifacts/official-webui/${scene}.json"
          done

      # This fixture is intentionally copied only after the optional upstream
      # build (its cross-plane e2e imports are not part of that aggregate), but
      # always before the source-provenance scene gate — including cache hits.
      - name: Prepare locked official interaction scene fixture
        run: |
          cp "$GITHUB_WORKSPACE/tools/reference-capture/capture-official-welcome.e2e.ts" \
            .reference/deepseek-harness/apps/web/tests/
          test -f .reference/deepseek-harness/apps/web/tests/capture-official-welcome.e2e.ts

      - name: Restore pinned DeepSeek Harness Host payload cache
        id: dsh-host-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.npm
            glass/build/backend/node_modules
          key: dsh-host-payload-v1-macos-26-arm64-node-${{ env.DSH_NODE_VERSION }}-${{ hashFiles('glass/ci/dsh-backend-payload/package-lock.json') }}

      - name: Install pinned DeepSeek Harness Host payload
        run: |
          mkdir -p glass/build/backend
          cp glass/ci/dsh-backend-payload/package.json glass/build/backend/package.json
          cp glass/ci/dsh-backend-payload/package-lock.json glass/build/backend/package-lock.json
          if [[ "${{ steps.dsh-host-cache.outputs.cache-hit }}" == "true" ]]; then
            test -d glass/build/backend/node_modules/@deepseek-ai/dsh
            test -d glass/build/backend/node_modules/@deepseek-ai/dsh-web-frontend
            echo "Reused cached pinned DeepSeek Harness Host payload."
          else
            cd glass/build/backend
            npm ci --no-audit --no-fund
          fi

      - name: Save pinned DeepSeek Harness Host payload cache
        if: steps.dsh-host-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.npm
            glass/build/backend/node_modules
          key: dsh-host-payload-v1-macos-26-arm64-node-${{ env.DSH_NODE_VERSION }}-${{ hashFiles('glass/ci/dsh-backend-payload/package-lock.json') }}

      - name: Install official spec generation toolchain
        run: |
          npm ci --no-audit --no-fund --prefix tools/spec-generation

      - name: Run official specification gates
        run: |
          set -euo pipefail
          echo "::group::Supported Host build boundary"
          python3 glass/ci/check-supported-host-build.py \
            --payload-dir glass/build/backend \
            --node glass/build/node/node
          echo "::endgroup::"
          echo "::group::Official UI spec build"
          python3 glass/ci/check-official-ui-spec-build.py \
            --official-root .reference/deepseek-harness \
            --node "$NODE24_BIN/node"
          python3 glass/ci/test-official-ui-spec-build.py \
            --official-root .reference/deepseek-harness
          echo "::endgroup::"
          echo "::group::Official locales and UI copy lint"
          python3 glass/ci/check-official-locales.py \
            --official-root .reference/deepseek-harness \
            --node "$NODE24_BIN/node"
          echo "::endgroup::"
          echo "::group::Official theme tokens"
          python3 glass/ci/check-official-theme-tokens.py \
            --official-root .reference/deepseek-harness
          echo "::endgroup::"
          echo "::group::Official three-column layout fixtures"
          python3 glass/ci/check-official-column-layout-fixtures.py \
            --official-root .reference/deepseek-harness \
            --node "$NODE24_BIN/node"
          echo "::endgroup::"
          echo "::group::Official interaction scene directory"
          python3 glass/ci/check-official-interaction-scenes.py \
            --official-root .reference/deepseek-harness
          echo "::endgroup::"
          echo "::group::Official rc.1 Remote contract"
          python3 glass/ci/check-official-remote-contract.py \
            --official-root .reference/deepseek-harness
          python3 glass/ci/test-official-remote-contract.py \
            .reference/deepseek-harness
          echo "::endgroup::"
          echo "::group::Authenticated rc.1 Host fixture"
          python3 glass/ci/check-authenticated-host-fixtures.py
          python3 glass/ci/test-authenticated-host-fixtures.py
          AUTH_CAPTURE="$(mktemp)"
          node tools/spec-generation/capture_authenticated_host_fixtures.mjs \
            --payload-root glass/build/backend \
            --output "$AUTH_CAPTURE"
          cmp glass/Sources/Core/Resources/official-authenticated-host-fixtures.json "$AUTH_CAPTURE"
          rm -f "$AUTH_CAPTURE"
          echo "::endgroup::"
          echo "::group::Official UI specification provenance and AST icon reproduction"
          ./glass/ci/check-official-spec.py \
            --official-root .reference/deepseek-harness
          echo "::endgroup::"
          echo "::group::Official Ghost Plane DOM, SlotMap, and ModuleLoader contract"
          python3 glass/ci/check-official-ghost-plane-contract.py \
            --official-root .reference/deepseek-harness
          python3 glass/ci/test-official-ghost-plane-contract.py \
            .reference/deepseek-harness
          echo "::endgroup::"

      # Fail Fast: Run Swift compilation and tests before assembling the app
      - name: Independently compile declared SwiftPM targets
        run: |
          cd glass
          swift build --configuration release --product DeepSeekHarnessGlassApp

      - name: Run all XCTest suites
        env:
          DSH_GLASS_HOST_NODE: ${{ github.workspace }}/glass/build/node/node
          DSH_GLASS_HOST_ENTRY: ${{ github.workspace }}/glass/build/backend/node_modules/@deepseek-ai/dsh/lib/bin.js
        run: |
          cd glass
          swift test

      - name: Run native architecture gates
        run: |
          set -euo pipefail
          echo "::group::Runtime asset migration inventory"
          python3 glass/ci/check-runtime-asset-inventory.py
          echo "::endgroup::"
          echo "::group::Structured SwiftPM target graph"
          python3 glass/ci/test-package-target-graph.py
          python3 glass/ci/check-package-target-graph.py
          echo "::endgroup::"
          echo "::group::RC8 visual recertification matrix"
          python3 glass/ci/test_rc8_recapture_matrix.py
          echo "::endgroup::"

      - name: Assemble native macOS app
        run: |
          export APP_PATH="$PWD/glass/dist/DeepSeek Harness.app"
          cd glass
          ./assemble.sh
          codesign -v "$APP_PATH"
          test -x "$APP_PATH/Contents/MacOS/DeepSeek Harness"

      - name: Restore displayplacer
        id: displayplacer-cache
        uses: actions/cache@v5
        with:
          path: |
            /opt/homebrew/bin/displayplacer
            /opt/homebrew/Cellar/displayplacer
          key: displayplacer-macos-26-arm64-1

      - name: Install displayplacer
        if: steps.displayplacer-cache.outputs.cache-hit != 'true'
        run: brew install displayplacer

      - name: Set display mode for snapshot viewport
        run: |
          # The hosted macOS runner boots at 1024x768. AppKit clamps any window
          # to the display, so the 1280x840 snapshot window silently became
          # 1024 wide and refreshForCurrentViewport resolved the layout at a
          # 1024 viewport, which drops the details column entirely. Widen the
          # display so the snapshot viewport is the one the baseline expects.
          # 1600x1200 is used rather than 1920x1080 because the tallest scene
          # requests a 1280x1100 content size, which does not fit under 1080.
          DISPLAY_ID="$(displayplacer list | awk '/Persistent screen id:/{print $4; exit}')"
          displayplacer "id:${DISPLAY_ID} res:1600x1200 hz:60 color_depth:7 enabled:true scaling:off origin:(0,0) degree:0"
          displayplacer list | grep -m1 'current mode'

      - name: Generate native UI layout snapshots
        run: |
          snapshot_dir="$PWD/artifacts/native-shell"
          DSH_GLASS_SNAPSHOT_DIR="$snapshot_dir" \
            ./glass/scripts/verify-native-shell.sh "$PWD/glass/dist/DeepSeek Harness.app" \
            | tee native-shell-snapshot.log
          test -s "$snapshot_dir/welcome-light.png"
          test -s "$snapshot_dir/welcome-dark.png"
          test -s "$snapshot_dir/conversation-dark.png"
          test -s "$snapshot_dir/deliverables-light.png"
          test -s "$snapshot_dir/model-selector-light.png"
          test -s "$snapshot_dir/permission-confirmation-light.png"
          test -s "$snapshot_dir/jobs-expanded-light.png"
          test -s "$snapshot_dir/jobs-expanded-dark.png"
          test -s "$snapshot_dir/tooling-inspector-light.png"
          test -s "$snapshot_dir/tooling-inspector-dark.png"
          test -s "$snapshot_dir/approval-panel-light.png"
          test -s "$snapshot_dir/question-composer-light.png"
          test -s "$snapshot_dir/workspace-search-official-viewport.png"
          test -s "$snapshot_dir/workspace-search-official-viewport-dark.png"
          test -s "$snapshot_dir/workspace-rename-official-viewport.png"
          test -s "$snapshot_dir/session-rename-official-viewport.png"
          test -s "$snapshot_dir/workspace-delete-official-viewport.png"
          test -s "$snapshot_dir/workspace-rename-official-viewport-dark.png"
          test -s "$snapshot_dir/session-rename-official-viewport-dark.png"
          test -s "$snapshot_dir/workspace-delete-official-viewport-dark.png"
          test -s "$snapshot_dir/approval-panel-official-viewport.png"
          test -s "$snapshot_dir/question-composer-official-viewport.png"
          test -s "$snapshot_dir/sidebar-rail-narrow-light.png"
          test -s "$snapshot_dir/sidebar-rail-narrow-dark.png"
          find "$snapshot_dir" -maxdepth 1 -type f -name '*.png' -print

      - name: Restore visual comparison Python environment
        id: visual-venv-cache
        uses: actions/cache@v5
        with:
          path: /tmp/dsh-visual-venv
          key: visual-venv-${{ runner.os }}-${{ env.IMAGE_VERSION }}-pillow-numpy-1

      - name: Compare official and native visual scenes
        run: |
          if [ ! -x /tmp/dsh-visual-venv/bin/python ]; then
            python3 -m venv /tmp/dsh-visual-venv
            /tmp/dsh-visual-venv/bin/python -m pip install --disable-pip-version-check --no-input Pillow numpy
          fi
          source /tmp/dsh-visual-venv/bin/activate
          python glass/ci/test_visual_policy.py
          python glass/ci/compare_visual_pair.py \
            --official artifacts/official-webui/welcome-no-workspace-light.png \
            --native artifacts/native-shell/welcome-light.png \
            --out-dir artifacts/visual-diff \
            --scene welcome-no-workspace-light \
            --policy glass/Sources/Spec/Fixtures/visual-validation-policy.json \
            --column-fixtures glass/Sources/Spec/Fixtures/official-column-layout-fixtures.json
          test -s artifacts/visual-diff/welcome-no-workspace-light-comparison.png
          test -s artifacts/visual-diff/welcome-no-workspace-light-report.json
          python glass/ci/compare_visual_pair.py \
            --official artifacts/official-webui/welcome-no-workspace-dark.png \
            --native artifacts/native-shell/welcome-dark.png \
            --out-dir artifacts/visual-diff \
            --scene welcome-no-workspace-dark \
            --policy glass/Sources/Spec/Fixtures/visual-validation-policy.json \
            --column-fixtures glass/Sources/Spec/Fixtures/official-column-layout-fixtures.json
          test -s artifacts/visual-diff/welcome-no-workspace-dark-comparison.png
          test -s artifacts/visual-diff/welcome-no-workspace-dark-report.json
          python glass/ci/compare_visual_pair.py \
            --official artifacts/official-webui/deliverables-light.png \
            --native artifacts/native-shell/deliverables-light.png \
            --out-dir artifacts/visual-diff \
            --scene deliverables-light \
            --policy glass/Sources/Spec/Fixtures/visual-validation-policy.json \
            --column-fixtures glass/Sources/Spec/Fixtures/official-column-layout-fixtures.json
          test -s artifacts/visual-diff/deliverables-light-comparison.png
          test -s artifacts/visual-diff/deliverables-light-report.json
          python glass/ci/compare_visual_pair.py \
            --official artifacts/official-webui/model-selector-light.png \
            --native artifacts/native-shell/model-selector-light.png \
            --out-dir artifacts/visual-diff \
            --scene model-selector-light \
            --policy glass/Sources/Spec/Fixtures/visual-validation-policy.json \
            --column-fixtures glass/Sources/Spec/Fixtures/official-column-layout-fixtures.json
          test -s artifacts/visual-diff/model-selector-light-comparison.png
          test -s artifacts/visual-diff/model-selector-light-report.json
          python glass/ci/compare_visual_pair.py \
            --official artifacts/official-webui/permission-confirmation-light.png \
            --native artifacts/native-shell/permission-confirmation-light.png \
            --out-dir artifacts/visual-diff \
            --scene permission-confirmation-light \
            --policy glass/Sources/Spec/Fixtures/visual-validation-policy.json \
            --column-fixtures glass/Sources/Spec/Fixtures/official-column-layout-fixtures.json
          test -s artifacts/visual-diff/permission-confirmation-light-comparison.png
          test -s artifacts/visual-diff/permission-confirmation-light-report.json
          python glass/ci/compare_visual_pair.py \
            --official artifacts/official-webui/sidebar-rail-narrow-light.png \
            --native artifacts/native-shell/sidebar-rail-narrow-light.png \
            --out-dir artifacts/visual-diff \
            --scene sidebar-rail-narrow-light \
            --policy glass/Sources/Spec/Fixtures/visual-validation-policy.json \
            --column-fixtures glass/Sources/Spec/Fixtures/official-column-layout-fixtures.json
          test -s artifacts/visual-diff/sidebar-rail-narrow-light-comparison.png
          test -s artifacts/visual-diff/sidebar-rail-narrow-light-report.json
          python glass/ci/compare_visual_pair.py \
            --official artifacts/official-webui/sidebar-rail-narrow-dark.png \
            --native artifacts/native-shell/sidebar-rail-narrow-dark.png \
            --out-dir artifacts/visual-diff \
            --scene sidebar-rail-narrow-dark \
            --policy glass/Sources/Spec/Fixtures/visual-validation-policy.json \
            --column-fixtures glass/Sources/Spec/Fixtures/official-column-layout-fixtures.json
          test -s artifacts/visual-diff/sidebar-rail-narrow-dark-comparison.png
          test -s artifacts/visual-diff/sidebar-rail-narrow-dark-report.json
          python glass/ci/compare_visual_pair.py \
            --official artifacts/official-webui/jobs-expanded-light.png \
            --native artifacts/native-shell/jobs-expanded-light.png \
            --out-dir artifacts/visual-diff \
            --scene jobs-expanded-light \
            --policy glass/Sources/Spec/Fixtures/visual-validation-policy.json \
            --column-fixtures glass/Sources/Spec/Fixtures/official-column-layout-fixtures.json
          test -s artifacts/visual-diff/jobs-expanded-light-comparison.png
          test -s artifacts/visual-diff/jobs-expanded-light-report.json
          python glass/ci/compare_visual_pair.py \
            --official artifacts/official-webui/jobs-expanded-dark.png \
            --native artifacts/native-shell/jobs-expanded-dark.png \
            --out-dir artifacts/visual-diff \
            --scene jobs-expanded-dark \
            --policy glass/Sources/Spec/Fixtures/visual-validation-policy.json \
            --column-fixtures glass/Sources/Spec/Fixtures/official-column-layout-fixtures.json
          test -s artifacts/visual-diff/jobs-expanded-dark-comparison.png
          test -s artifacts/visual-diff/jobs-expanded-dark-report.json
          python glass/ci/compare_visual_pair.py \
            --official artifacts/official-webui/tooling-inspector-light.png \
            --native artifacts/native-shell/tooling-inspector-light.png \
            --out-dir artifacts/visual-diff \
            --scene tooling-inspector-light \
            --policy glass/Sources/Spec/Fixtures/visual-validation-policy.json \
            --column-fixtures glass/Sources/Spec/Fixtures/official-column-layout-fixtures.json
          test -s artifacts/visual-diff/tooling-inspector-light-comparison.png
          test -s artifacts/visual-diff/tooling-inspector-light-report.json
          for scene in workspace-search-light workspace-search-dark workspace-rename-light workspace-rename-dark session-rename-light session-rename-dark workspace-delete-light workspace-delete-dark approval-composer-light question-composer-light; do
            case "$scene" in
              workspace-search-light) native="workspace-search-official-viewport.png" ;;
              workspace-search-dark) native="workspace-search-official-viewport-dark.png" ;;
              workspace-rename-light) native="workspace-rename-official-viewport.png" ;;
              workspace-rename-dark) native="workspace-rename-official-viewport-dark.png" ;;
              session-rename-light) native="session-rename-official-viewport.png" ;;
              session-rename-dark) native="session-rename-official-viewport-dark.png" ;;
              workspace-delete-light) native="workspace-delete-official-viewport.png" ;;
              workspace-delete-dark) native="workspace-delete-official-viewport-dark.png" ;;
              approval-composer-light) native="approval-panel-official-viewport.png" ;;
              question-composer-light) native="question-composer-official-viewport.png" ;;
              *) echo "unknown RC8 visual scene: $scene" >&2; exit 1 ;;
            esac
            python glass/ci/compare_visual_pair.py \
              --official "artifacts/official-webui/${scene}.png" \
              --native "artifacts/native-shell/${native}" \
              --out-dir artifacts/visual-diff \
              --scene "$scene" \
              --policy glass/Sources/Spec/Fixtures/visual-validation-policy.json \
              --column-fixtures glass/Sources/Spec/Fixtures/official-column-layout-fixtures.json
            test -s "artifacts/visual-diff/${scene}-comparison.png"
            test -s "artifacts/visual-diff/${scene}-report.json"
          done

      - name: Upload native UI review bundle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-ui-${{ github.sha }}
          path: |
            artifacts/native-shell/
            artifacts/official-webui/
            artifacts/visual-diff/
            native-shell-snapshot.log
            xcodebuild-version.txt
            macos-sdk-version.txt
            glass/dist/DeepSeek Harness.app/Contents/Resources/SupportedHostBuilds.json
            glass/dist/DeepSeek Harness.app/Contents/Resources/BuildManifest.json
            glass/ci/dsh-backend-payload/package-lock.json
            glass/Sources/Spec/RuntimeAssetInventory.json
            glass/Sources/Spec/OfficialUISpec/official-ui-spec-build.json
            glass/Sources/Spec/OfficialUISpecBuild.swift
            glass/Sources/Spec/Locales/official-locales.json
            glass/Sources/Spec/OfficialLocaleCatalog.swift
            glass/Sources/Spec/Tokens/official-theme-tokens.json
            glass/Sources/Spec/OfficialThemeCatalog.swift
            glass/Sources/Spec/Fixtures/official-column-layout-fixtures.json
            glass/Sources/Spec/Fixtures/official-interaction-scenes.json
            glass/Sources/Spec/Fixtures/official-remote-contract-manifest.json
            glass/Sources/Core/Resources/official-authenticated-host-fixtures.json
            glass/Package.swift
          if-no-files-found: error
          retention-days: 14
