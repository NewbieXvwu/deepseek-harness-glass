name: CUT6.3 lift raw tool projection state

on:
  push:
    branches: [gpt-continue-todo-20260905]
    paths: [.github/workflows/cut63-lift-tool-invocation.yml]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          ref: gpt-continue-todo-20260905
          fetch-depth: 0

      - name: Lift ToolInvocation into Core projection domain
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          store = Path('glass/Sources/Core/Session/NativeSessionStore.swift')
          text = store.read_text()
          marker = '    struct ToolInvocation: Identifiable {'
          start = text.find(marker)
          if start < 0:
              raise SystemExit('NativeSessionStore.ToolInvocation block not found')
          open_brace = text.find('{', start)
          depth = 0
          state = 'code'
          i = open_brace
          end = None
          while i < len(text):
              c = text[i]
              n = text[i + 1] if i + 1 < len(text) else ''
              if state == 'code':
                  if c == '"': state = 'string'
                  elif c == '/' and n == '/': state = 'line'; i += 1
                  elif c == '/' and n == '*': state = 'block'; i += 1
                  elif c == '{': depth += 1
                  elif c == '}':
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          break
              elif state == 'string':
                  if c == '\\': i += 1
                  elif c == '"': state = 'code'
              elif state == 'line':
                  if c == '\n': state = 'code'
              elif state == 'block':
                  if c == '*' and n == '/': state = 'code'; i += 1
              i += 1
          if end is None:
              raise SystemExit('unbalanced ToolInvocation block')

          block = dedent(text[start:end])
          block = block.replace('struct ToolInvocation: Identifiable {', 'struct SessionToolInvocation: Identifiable, Sendable {', 1)
          block = block.replace('enum State: Equatable {', 'enum State: Sendable, Equatable {', 1)
          model = Path('glass/Sources/Core/Session/Projection/Tooling/SessionToolInvocation.swift')
          if model.exists():
              raise SystemExit('SessionToolInvocation.swift already exists')
          header = 'import Foundation\n\n/// Transport-free rc.1 tool call/result projection value. Card projectors depend on this Core value, never MainActor Store state.\n'
          model.write_text(header + block + '\n')

          text = text[:start] + '    typealias ToolInvocation = SessionToolInvocation\n' + text[end:]
          store.write_text(text)

          projector = Path('glass/Sources/Core/Session/Projection/Tooling/NativeRawToolCardProjector.swift')
          p = projector.read_text()
          count = p.count('NativeSessionStore.ToolInvocation')
          if count != 5:
              raise SystemExit(f'expected 5 projector Store type references, found {count}')
          projector.write_text(p.replace('NativeSessionStore.ToolInvocation', 'SessionToolInvocation'))

          tests = Path('glass/Tests/Core/NativeRawToolCardProjectorTests.swift')
          t = tests.read_text()
          if 'NativeSessionStore.ToolInvocation' not in t:
              raise SystemExit('expected projector tests to construct Store ToolInvocation')
          tests.write_text(t.replace('NativeSessionStore.ToolInvocation', 'SessionToolInvocation'))
          PY

          ! grep -n 'NativeSessionStore.ToolInvocation' glass/Sources/Core/Session/Projection/Tooling/NativeRawToolCardProjector.swift
          ! grep -n 'NativeSessionStore.ToolInvocation' glass/Tests/Core/NativeRawToolCardProjectorTests.swift
          grep -n 'typealias ToolInvocation = SessionToolInvocation' glass/Sources/Core/Session/NativeSessionStore.swift
          grep -n 'struct SessionToolInvocation: Identifiable, Sendable' glass/Sources/Core/Session/Projection/Tooling/SessionToolInvocation.swift
          git diff --check

      - name: Compile SwiftPM app
        shell: bash
        run: |
          cd glass
          swift build --configuration release --product DeepSeekHarnessGlassApp

      - name: Run raw tool projector XCTest
        shell: bash
        run: |
          cd glass
          swift test --filter NativeRawToolCardProjectorTests

      - name: Run all XCTest suites
        shell: bash
        run: |
          cd glass
          swift test

      - name: Commit migration and remove helper
        shell: bash
        run: |
          rm .github/workflows/cut63-lift-tool-invocation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add glass/Sources/Core/Session/Projection/Tooling/SessionToolInvocation.swift \
                  glass/Sources/Core/Session/NativeSessionStore.swift \
                  glass/Sources/Core/Session/Projection/Tooling/NativeRawToolCardProjector.swift \
                  glass/Tests/Core/NativeRawToolCardProjectorTests.swift \
                  .github/workflows/cut63-lift-tool-invocation.yml
          git commit -m 'core: lift raw tool invocation projection state'
          git push origin HEAD:gpt-continue-todo-20260905
