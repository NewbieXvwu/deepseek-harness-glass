name: CUT5.8 command routing one-shot

on:
  push:
    branches: [gpt-continue-todo-20260905]
    paths:
      - .github/workflows/cut58-command-routing.yml

permissions:
  contents: write

jobs:
  apply-cut:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: gpt-continue-todo-20260905
      - name: Apply exact command routing edits
        run: python3 tools/cut58_command_routing.py
      - name: Commit result and remove helpers
        run: |
          set -euo pipefail
          rm .github/workflows/cut58-command-routing.yml tools/cut58_command_routing.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add glass/Sources/Core/Session/NativeSessionStore.swift \
                  glass/Sources/UI/Shell/NativeSplitContainer.swift \
                  .github/workflows/cut58-command-routing.yml \
                  tools/cut58_command_routing.py
          git diff --cached --check
          git commit -m "core: route session interaction mutations through command service"
          git push origin HEAD:gpt-continue-todo-20260905
