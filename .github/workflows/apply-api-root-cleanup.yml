name: apply-api-root-cleanup
on:
  push:
    branches: [gpt-continue-todo-20260905]
    paths: [.github/workflows/apply-api-root-cleanup.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('glass/Sources/Core/Transport/DomainAPIs.swift')
          text = p.read_text()
          needles = [
              '    let feedback: MessageFeedbackAPI\n',
              '        feedback = MessageFeedbackAPI(client: client)\n',
          ]
          for needle in needles:
              if text.count(needle) != 1:
                  raise SystemExit(f'unexpected match count for {needle!r}')
              text = text.replace(needle, '')
          p.write_text(text)
          PY
          git rm .github/workflows/apply-api-root-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add glass/Sources/Core/Transport/DomainAPIs.swift
          git commit -m "chore: remove legacy feedback facade from api root"
          git push origin HEAD:gpt-continue-todo-20260905
