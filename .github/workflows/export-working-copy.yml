name: export-working-copy

on:
  push:
    branches:
      - gpt-continue-todo-20260905
    paths:
      - .github/workflows/export-working-copy.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create bundle
        run: git bundle create deepseek-harness-glass.bundle --all
      - uses: actions/upload-artifact@v4
        with:
          name: deepseek-harness-glass-working-copy
          path: deepseek-harness-glass.bundle
          if-no-files-found: error
          retention-days: 1
