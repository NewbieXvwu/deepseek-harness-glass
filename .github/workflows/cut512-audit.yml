name: CUT5.12 legacy ingest audit

on:
  push:
    branches: [gpt-continue-todo-20260905]
    paths: [.github/workflows/cut512-audit.yml]

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt-continue-todo-20260905
          fetch-depth: 0
      - name: Inventory legacy session ingest references
        run: |
          echo '=== SessionHistoryPager ==='
          find glass -type f -name '*.swift' -print0 | xargs -0 grep -nH 'SessionHistoryPager' || true
          echo '=== applyMuxFrame ==='
          grep -R -n --include='*.swift' 'applyMuxFrame' glass || true
          echo '=== session history calls ==='
          grep -R -n --include='*.swift' -E '(session\.history|\.history\(sessionID:|func history\(sessionID:)' glass || true
          echo '=== subscribed legacy ==='
          grep -R -n --include='*.swift' -E '(subscribedLastSequence|session/subscribed|SessionSubscribedDTO|recoveryLiveBuffer|requestAuthorityRecovery)' glass || true
      - name: Remove audit helper
        if: always()
        run: |
          rm .github/workflows/cut512-audit.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/cut512-audit.yml
          git commit -m 'ci: remove CUT5.12 legacy ingest audit helper'
          git push origin HEAD:gpt-continue-todo-20260905
