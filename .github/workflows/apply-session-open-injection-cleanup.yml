name: apply-session-open-injection-cleanup
on:
  push:
    branches: [gpt-continue-todo-20260905]
    paths: [.github/workflows/apply-session-open-injection-cleanup.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('glass/Sources/UI/Shell/NativeSplitContainer.swift')
          s=p.read_text()
          needle='                using: apis.sessions,\n'
          if s.count(needle)!=2: raise SystemExit('expected two legacy session open injections')
          p.write_text(s.replace(needle,''))
          PY
          git rm .github/workflows/apply-session-open-injection-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add glass/Sources/UI/Shell/NativeSplitContainer.swift
          git commit -m "chore: stop injecting legacy sessions api on open"
          git push origin HEAD:gpt-continue-todo-20260905
