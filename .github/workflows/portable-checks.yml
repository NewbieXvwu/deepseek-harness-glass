name: portable-checks

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "README.zh.md"
      - "CONTRIBUTING.md"
      - "TODO.md"
      - "CONTINUOUS_EXECUTION_PLAN.md"
      - "notes/**"
      - "visual-review/**"
      - ".github/workflows/documentation-integrity.yml"
      - "tools/check-markdown-links.py"
  pull_request:
    paths-ignore:
      - "README.md"
      - "README.zh.md"
      - "CONTRIBUTING.md"
      - "TODO.md"
      - "CONTINUOUS_EXECUTION_PLAN.md"
      - "notes/**"
      - "visual-review/**"
      - ".github/workflows/documentation-integrity.yml"
      - "tools/check-markdown-links.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  OFFICIAL_COMMIT: b150a551b8d465e31e418e1b2eaf5e79bbb7d28e
  DSH_NODE_VERSION: 24.19.0

jobs:
  python-spec-gates:
    name: fast python specification gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Checkout locked official DeepSeek Harness source
        uses: actions/checkout@v5
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ env.OFFICIAL_COMMIT }}
          path: .reference/deepseek-harness

      # The locale gate parses upstream TypeScript through its locked `typescript`
      # dependency; runner-global Node is neither sufficient nor reproducible.
      - name: Set up locked Node runtime
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.DSH_NODE_VERSION }}

      - name: Install locked pnpm and resolve cache directory
        run: |
          # Install the exact package-manager release declared by the locked
          # official source. Avoid runner or Corepack keyring drift.
          npm install --global pnpm@11.7.0
          test "$(pnpm --version)" = "11.7.0"
          echo "PNPM_STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Restore official pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: portable-spec-pnpm-${{ runner.os }}-${{ env.DSH_NODE_VERSION }}-${{ env.OFFICIAL_COMMIT }}-${{ hashFiles('.reference/deepseek-harness/pnpm-lock.yaml') }}
          restore-keys: |
            portable-spec-pnpm-${{ runner.os }}-${{ env.DSH_NODE_VERSION }}-${{ env.OFFICIAL_COMMIT }}-

      - name: Install locked official TypeScript dependencies
        run: |
          cd .reference/deepseek-harness
          pnpm install --frozen-lockfile
          test -d node_modules/typescript

      - name: Install project specification-generation parser
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --prefix tools/spec-generation
          test -f tools/spec-generation/node_modules/typescript/lib/typescript.js

      - name: Run Python specification and architecture gates
        run: |
          set -euo pipefail
          echo "::group::Official UI spec build"
          python3 glass/ci/check-official-ui-spec-build.py \
            --official-root .reference/deepseek-harness
          python3 glass/ci/test-official-ui-spec-build.py \
            --official-root .reference/deepseek-harness
          echo "::endgroup::"
          echo "::group::Official locales and UI copy lint"
          python3 glass/ci/check-official-locales.py \
            --official-root .reference/deepseek-harness
          echo "::endgroup::"
          echo "::group::Official theme tokens"
          python3 glass/ci/test-official-theme-tokens.py \
            --official-root .reference/deepseek-harness
          python3 glass/ci/check-official-theme-tokens.py \
            --official-root .reference/deepseek-harness
          echo "::endgroup::"
          echo "::group::Official interaction scene directory"
          python3 glass/ci/check-official-interaction-scenes.py \
            --official-root .reference/deepseek-harness
          echo "::endgroup::"
          echo "::group::Official RPC DTO manifest"
          python3 glass/ci/check-official-rpc-dto-manifest.py \
            --official-root .reference/deepseek-harness
          echo "::endgroup::"
          echo "::group::Official transport contract baseline"
          python3 glass/ci/check-official-transport-contract.py \
            --official-root .reference/deepseek-harness
          echo "::endgroup::"
          echo "::group::Official UI specification provenance"
          ./glass/ci/check-official-spec.py \
            --official-root .reference/deepseek-harness
          echo "::endgroup::"
          echo "::group::Runtime asset migration inventory"
          python3 glass/ci/test-runtime-asset-inventory.py
          python3 glass/ci/check-runtime-asset-inventory.py
          echo "::endgroup::"
      - name: Verify CI feedback topology
        run: python3 glass/ci/test-ci-workflow-layout.py


  portable-swift:
    name: fast portable Swift tests
    runs-on: ubuntu-latest
    container: swift:6.2.4-noble
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build and test portable Swift targets
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3
          python3 glass/ci/test-package-target-graph.py
          python3 glass/ci/check-package-target-graph.py
          # Execute the production app assembler against a target-triple SwiftPM
          # fixture. This catches resource-bundle path regressions without a
          # macOS runner or a source-text heuristic.
          chmod +x glass/ci/test-assemble-resource-bundle.sh
          ./glass/ci/test-assemble-resource-bundle.sh
          # Parse macOS-only PluginPlane sources as a syntax gate even on Linux.
          # Their typed AppKit/WebKit build remains the native-ui authority.
          swiftc -parse glass/Sources/PluginPlane/GhostPlaneWebViewHost.swift \
            glass/Sources/PluginPlane/GhostPlaneScrollViewBridge.swift \
            glass/Sources/PluginPlane/GhostPlanePermissionPromptPresenter.swift \
            glass/Sources/PluginPlane/GhostPlaneNotificationAdapter.swift \
            glass/Sources/PluginPlane/GhostPlaneClipboardAdapter.swift \
            glass/Sources/PluginPlane/GhostPlaneExternalNavigationAdapter.swift \
            glass/Sources/PluginPlane/GhostPlaneFilePickerAdapter.swift \
            glass/Sources/PluginPlane/GhostPlaneDownloadAdapter.swift \
            glass/Sources/PluginPlane/GhostPlaneNetworkStatusAdapter.swift \
            glass/Sources/PluginPlane/GhostPlaneVisibilityStatusAdapter.swift
          # Compile only the portable production source plus a CLI regression
          # harness. This avoids resolving the macOS-only XCTest target graph.
          swiftc glass/Sources/PortableCore/HostPathDisplay.swift \
            glass/ci/portable-core-check.swift \
            -o /tmp/portable-core-check
          /tmp/portable-core-check
          # NativeUIManifest stays declarative and is verified through a Core-only
          # seam so version/integrity failures never wait on a macOS GUI build.
          swiftc glass/Sources/Core/Plugin/NativeUIManifest.swift \
            glass/ci/native-ui-manifest-portable-check.swift \
            -o /tmp/native-ui-manifest-portable-check
          /tmp/native-ui-manifest-portable-check
          # T9.2 keeps rc.2 generic tool row projection Foundation-only so
          # malformed payload fallback and code-body extraction receive a fast
          # executable regression without resolving the AppKit target graph.
          swiftc glass/Sources/Core/Session/NativeToolTerminalPresentation.swift \
            glass/Sources/Core/Session/NativeToolResultTextPresentation.swift \
            glass/Sources/Core/Session/NativeToolReadPresentation.swift \
            glass/Sources/UI/Tooling/NativeToolRowPresentation.swift \
            glass/ci/native-tool-row-presentation-portable-check.swift \
            -o /tmp/native-tool-row-presentation-portable-check
          /tmp/native-tool-row-presentation-portable-check
          swiftc glass/Sources/Core/Plugin/NativeUIManifest.swift \
            glass/Sources/UI/Settings/NativeSchemaFormDraft.swift \
            glass/ci/native-schema-form-draft-portable-check.swift \
            -o /tmp/native-schema-form-draft-portable-check
          /tmp/native-schema-form-draft-portable-check
          swiftc glass/Sources/Core/Plugin/NativeUIManifest.swift \
            glass/Sources/Core/Plugin/SwiftAdapterRegistry.swift \
            glass/ci/swift-adapter-registry-portable-check.swift \
            -o /tmp/swift-adapter-registry-portable-check
          /tmp/swift-adapter-registry-portable-check
          swiftc glass/Sources/Core/Plugin/GhostPlaneSkeleton.swift \
            glass/ci/ghost-plane-skeleton-portable-check.swift \
            -o /tmp/ghost-plane-skeleton-portable-check
          /tmp/ghost-plane-skeleton-portable-check
          swiftc glass/Sources/Core/Plugin/GhostPlaneContentSecurityPolicy.swift \
            glass/ci/ghost-plane-csp-portable-check.swift \
            -o /tmp/ghost-plane-csp-portable-check
          /tmp/ghost-plane-csp-portable-check
          swiftc glass/Sources/Core/Plugin/GhostPlaneLoopbackPolicy.swift \
