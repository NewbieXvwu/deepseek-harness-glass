name: portable-checks

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "README.zh.md"
      - "CONTRIBUTING.md"
      - "TODO.md"
      - "CONTINUOUS_EXECUTION_PLAN.md"
      - "notes/**"
      - "visual-review/**"
      - ".github/workflows/documentation-integrity.yml"
      - "tools/check-markdown-links.py"
  pull_request:
    paths-ignore:
      - "README.md"
      - "README.zh.md"
      - "CONTRIBUTING.md"
      - "TODO.md"
      - "CONTINUOUS_EXECUTION_PLAN.md"
      - "notes/**"
      - "visual-review/**"
      - ".github/workflows/documentation-integrity.yml"
      - "tools/check-markdown-links.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  OFFICIAL_COMMIT: a66e4702047846cdaa10c66c9d3df3951f5ea70d
  DSH_NODE_VERSION: 24.19.0

jobs:
  migrate-cut512-store-fixtures:
    name: migrate CUT5.12 Store fixtures
    if: github.event_name == 'pull_request' && github.head_ref == 'gpt-continue-todo-20260905'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: gpt-continue-todo-20260905
          fetch-depth: 0
      - name: Align Store tests with runtime authority
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('glass/Tests/Core/NativeSessionStoreTests.swift')
          text = path.read_text()

          def brace_end(source, open_brace):
              depth = 0
              i = open_brace
              state = 'code'
              while i < len(source):
                  c = source[i]
                  n = source[i + 1] if i + 1 < len(source) else ''
                  if state == 'code':
                      if c == '"': state = 'string'
                      elif c == '/' and n == '/': state = 'line'; i += 1
                      elif c == '/' and n == '*': state = 'block'; i += 1
                      elif c == '{': depth += 1
                      elif c == '}':
                          depth -= 1
                          if depth == 0: return i + 1
                  elif state == 'string':
                      if c == '\\': i += 1
                      elif c == '"': state = 'code'
                  elif state == 'line':
                      if c == '\n': state = 'code'
                  elif state == 'block':
                      if c == '*' and n == '/': state = 'code'; i += 1
                  i += 1
              raise RuntimeError('unbalanced braces')

          def remove_test(source, name):
              match = re.search(r'^    func ' + re.escape(name) + r'\s*\(', source, re.M)
              if not match:
                  return source
              end = brace_end(source, source.find('{', match.start()))
              if end < len(source) and source[end] == '\n': end += 1
              return source[:match.start()] + source[end:]

          for name in [
              'testLoadOlderHistoryGuardsKeepWindowAndAdoptEmptyPageHasMore',
              'testNewEndpointOpenSupersedesStaleInitialHistoryAuthority',
              'testResidentResyncIgnoresLateFailureFromStaleInitialHistory',
              'testResidentResyncSupersedesStaleInitialHistoryOnSameEndpoint',
          ]:
              text = remove_test(text, name)

          projection = '''        store.projections.apply(
            sessionID: {session},
            key: "imageLimits",
            value: .object([
                "maxImageBytes": .number(4_096),
                "maxImagesPerMessage": .number(2),
                "maxMessageImageBytes": .number(8_192),
                "maxImagePixels": .number(16),
                "maxImageDimension": .number(4),
                "mediaTypes": .array([.string("image/png")]),
            ]),
            seq: 0
        )
'''
          replacements = [
              (
                  '        store.open(sessionID: sessionID, using: api, endpoint: URL(string: "http://127.0.0.1:1")!)\n        await eventually(timeout: 1) { store.imageAttachmentLimits != nil }\n',
                  '        store.open(sessionID: sessionID, using: api, endpoint: URL(string: "http://127.0.0.1:1")!)\n' + projection.format(session='sessionID') + '        await eventually(timeout: 1) { store.imageAttachmentLimits != nil }\n'
              ),
              (
                  '        store.open(sessionID: "rejected-image-prompt-session", using: api, endpoint: URL(string: "http://127.0.0.1:1")!)\n        await eventually(timeout: 1) { store.imageAttachmentLimits != nil }\n',
                  '        store.open(sessionID: "rejected-image-prompt-session", using: api, endpoint: URL(string: "http://127.0.0.1:1")!)\n' + projection.format(session='"rejected-image-prompt-session"') + '        await eventually(timeout: 1) { store.imageAttachmentLimits != nil }\n'
              ),
          ]
          for old, new in replacements:
              if old in text:
                  text = text.replace(old, new, 1)

          path.write_text(text)
          PY
          git diff --check
          if git diff --quiet -- glass/Tests/Core/NativeSessionStoreTests.swift; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add glass/Tests/Core/NativeSessionStoreTests.swift
          git commit -m "test: align store coverage with runtime authority"
          git push origin HEAD:gpt-continue-todo-20260905

  python-spec-gates:
    name: fast python specification gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Checkout locked official DeepSeek Harness source
        uses: actions/checkout@v5
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ env.OFFICIAL_COMMIT }}
          path: .reference/deepseek-harness

      - name: Set up locked Node runtime
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.DSH_NODE_VERSION }}

      - name: Install locked pnpm and resolve cache directory
        run: |
          npm install --global pnpm@11.7.0
          test "$(pnpm --version)" = "11.7.0"
          echo "PNPM_STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Restore official pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: portable-spec-pnpm-${{ runner.os }}-${{ env.DSH_NODE_VERSION }}-${{ env.OFFICIAL_COMMIT }}-${{ hashFiles('.reference/deepseek-harness/pnpm-lock.yaml') }}
          restore-keys: |
            portable-spec-pnpm-${{ runner.os }}-${{ env.DSH_NODE_VERSION }}-${{ env.OFFICIAL_COMMIT }}-

      - name: Install locked official TypeScript dependencies
        run: |
          cd .reference/deepseek-harness
          pnpm install --frozen-lockfile
          test -d node_modules/typescript

      - name: Install project specification-generation parser
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --prefix tools/spec-generation
          test -f tools/spec-generation/node_modules/typescript/lib/typescript.js

      - name: Run Python specification and architecture gates
        run: |
          set -euo pipefail
          echo "::group::Official UI spec build"
          python3 glass/ci/check-official-ui-spec-build.py \
            --official-root .reference/deepseek-harness
          python3 glass/ci/test-official-ui-spec-build.py \
            --official-root .reference/deepseek-harness
          echo "::endgroup::"
          echo "::group::Official locales and UI copy lint"
          python3 glass/ci/check-official-locales.py \
            --official-root .reference/deepseek-harness
          echo "::endgroup::"
          echo "::group::Official theme tokens"
          python3 glass/ci/test-official-theme-tokens.py \
            --official-root .reference/deepseek-harness
          python3 glass/ci/check-official-theme-tokens.py \
            --official-root .reference/deepseek-harness
          echo "::endgroup::"
          echo "::group::Official interaction scene directory"
          python3 glass/ci/check-official-interaction-scenes.py \
            --official-root .reference/deepseek-harness
          echo "::endgroup::"
          echo "::group::Official rc.1 Remote contract"
          python3 glass/ci/check-official-remote-contract.py \
            --official-root .reference/deepseek-harness
          echo "::endgroup::"
          echo "::group::Authenticated rc.1 Host fixture"
          python3 glass/ci/check-authenticated-host-fixtures.py
          echo "::endgroup::"
          echo "::group::Official UI specification provenance"
          ./glass/ci/check-official-spec.py \
            --official-root .reference/deepseek-harness
          echo "::endgroup::"
          echo "::group::Runtime asset migration inventory"
          python3 glass/ci/test-runtime-asset-inventory.py
          python3 glass/ci/check-runtime-asset-inventory.py
          echo "::endgroup::"
      - name: Verify CI feedback topology
        run: python3 glass/ci/test-ci-workflow-layout.py
      - name: Scan for tautological test assertions (report-only)
        run: python3 glass/ci/check-test-integrity.py
      - name: Scan generated-prose style (report-only)
        run: python3 tools/check-doc-style.py
