            glass/ci/ghost-plane-module-manifest-portable-check.swift \
            -o /tmp/ghost-plane-module-manifest-portable-check
          /tmp/ghost-plane-module-manifest-portable-check
          swiftc glass/Sources/Core/Plugin/GhostPlaneLoopbackPolicy.swift \
