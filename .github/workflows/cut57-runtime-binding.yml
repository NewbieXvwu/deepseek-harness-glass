name: CUT5.7 runtime binding one-shot

on:
  push:
    branches: [gpt-continue-todo-20260905]
    paths:
      - .github/workflows/cut57-runtime-binding.yml

permissions:
  contents: write

jobs:
  apply-cut:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: gpt-continue-todo-20260905
      - name: Bind shared generation dependencies
        run: python3 tools/cut57_runtime_binding.py
      - name: Commit result and remove helpers
        run: |
          set -euo pipefail
          rm .github/workflows/cut57-runtime-binding.yml tools/cut57_runtime_binding.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add glass/Sources/UI/Shell/NativeSplitContainer.swift \
                  .github/workflows/cut57-runtime-binding.yml \
                  tools/cut57_runtime_binding.py
          git diff --cached --check
          git commit -m "core: bind session runtime to generation-scoped services"
          git push origin HEAD:gpt-continue-todo-20260905
